button,input,select,textarea{font:inherit}

background:linear-gradient(135deg,#4b0082,#6a11cb,#e91e63);

padding:12px

align-items:center;
gap:10px;
flex-wrap:wrap;

.logo{
font-size:25px;
font-weight:800;
white-space:nowrap
}

.tag{

.search{

min-width:220px;
display:flex;
background:#fff;
border-radius:25px;
overflow:hidden

.search input{

border:0;
padding:12px 15px;
outline:0;
min-width:0
}

.search button{
background:#fff;
padding:0 10px
}

.navbtn{
background:#ffffff22;
color:#fff;
padding:10px 12px;
border-radius:20px;
font-weight:600
}

.navbtn:hover{
background:#ffffff35
}

.count{
display:inline-flex;
min-width:21px;
height:21px;
align-items:center;
justify-content:center;
background:#ff4081;
color:#fff;
border-radius:50%;
font-size:12px;
margin-left:3px
}

.page{
max-width:1200px;
margin:auto;
padding:14px
}

.hero{
background:linear-gradient(135deg,#fff0fa,#eee5ff);
border-radius:20px;
padding:24px;
margin-bottom:16px
}

.hero h1{
margin:0 0 8px;
color:#5c16b8
}

.quick{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:14px
}

.pill{
background:#fff;
border:1px solid #ddd;
padding:9px 13px;
border-radius:20px
}

.pill:hover{
border-color:#8e2de2;
color:#6a11cb
}

.pill.active{

color:#fff;
border-color:#6a11cb
}

.section{
margin:22px 0
}

.section h2{
margin:0 0 12px
}

.hscroll{
display:flex;
gap:14px;
overflow-x:auto;
padding:5px 2px 12px

.cat{

.catpic{

height:78px;

align-items:center;
justify-content:center;
background:#fff;
border:2px solid #eadcff;
box-shadow:0 3px 10px #0001;
font-size:35px;

.cat b{

font-size:13px;
margin-top:7px

.banner{
background:linear-gradient(100deg,#4b0082,#a4508b,#e91e63);
color:#fff;
border-radius:18px;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.banner button{
background:#fff;
color:#6812ad;
padding:10px 15px;
border-radius:20px;
font-weight:bold
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:14px
}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 10px #0001;

.photo{
height:155px;
background:linear-gradient(135deg,#eee,#fafafa);
display:flex;
align-items:center;
justify-content:center;
font-size:70px
}

.heart{
position:absolute;
right:8px;
top:8px;
background:#fff;
border-radius:50%;
width:36px;
height:36px;
font-size:20px;
box-shadow:0 2px 7px #0002;
z-index:2
}

.heart.liked{
color:#e91e63
}

.cardbody{
padding:11px
}

.price{
font-size:20px;
font-weight:800
}

.old{

color:#888;
font-size:13px;
margin-left:5px
}

.off{
color:#16833c;
font-weight:700;
font-size:13px;
margin-left:5px
}

.rating{
color:#087b36;
font-weight:700;
margin-top:5px
}

.buy{
width:100%;
margin-top:9px;
padding:10px;
border-radius:10px;
background:linear-gradient(135deg,#4b0082,#8e2de2);
color:#fff;
font-weight:bold
}

.buy:hover{
background:linear-gradient(135deg,#6a11cb,#e91e63)
}

.buy.secondary{
background:#fff;
color:#5c16b8;
border:1px solid #8e2de2
}

.panel{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 2px 12px #0001;
margin-bottom:15px
}

.panel h2,.panel h3{
color:#3f126d
}

.back{
background:#eee;
padding:9px 14px;
border-radius:18px;
margin-bottom:12px
}

.row{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap
}

.grow{
flex:1
}

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:5px
}

.field input,
.field select,
.field textarea{
padding:11px;
border:1px solid #ccc;
border-radius:10px;
outline:none
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#8e2de2
}

.field textarea{
min-height:80px
}

.notice{
background:#fff8df;
border:1px solid #efd57c;
border-radius:12px;
padding:12px;
margin:10px 0
}

.success{
background:#e9fff1;
border:1px solid #9ed8b1;
border-radius:12px;
padding:14px;
margin:10px 0
}

.info{
background:#f3edff;
border:1px solid #d8c6ff;
border-radius:12px;
padding:14px;
margin:10px 0
}

.empty{
text-align:center;
padding:30px;
background:#fff;
border-radius:18px;
box-shadow:0 2px 10px #0001
}

.qtybox{
display:flex;
align-items:center;
gap:7px
}

.qtybox button{
width:30px;
height:30px;
border-radius:50%;
background:#eee
}

.cartitem{
padding:14px 0;
border-bottom:1px solid #eee
}

.cartitem:last-child{

.selectrow{
display:flex;
align-items:center;
gap:8px

.bottom{

bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid #ddd;
padding:9px;
display:flex;
justify-content:center;
gap:8px;
z-index:40
}

.bottom button{
background:#f2eff8;
padding:9px 12px;
border-radius:12px
}

.bottom button:hover{
background:#eadcff;
color:#5c16b8
}

.modal{

inset:0;
background:#0008;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px

.modalbox{
background:#fff;
border-radius:18px;
max-width:760px;
width:100%;
max-height:90vh;
overflow:auto;
padding:20px

.modal.show{
display:flex

.closebtn{
float:right;
background:#eee;
border-radius:50%;
width:34px;
height:34px
}

bottom:8px;
z-index:30;
background:#fff;
padding:10px;
border-radius:16px;
box-shadow:0 -4px 18px #0002;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:18px

.stickyBuy button{
padding:13px;
border-radius:12px;
font-weight:800

.stickyCart{

border:2px solid #6a11cb;
color:#5c16b8

.stickyNow{

color:#fff;

}

.sizebtn.unavailable{

align-items:center;
gap:14px;

height:62px;

justify-content:space-between;
gap:4px;

.track:before{
content:"";
position:absolute;
top:15px;
left:6%;
right:6%;
height:4px;
background:#ddd
}

.step{
z-index:1;
text-align:center;
font-size:11px;
max-width:90px
}

.dot{
width:30px;
height:30px;
border-radius:50%;
background:#eee;
margin:auto;
padding-top:7px
}

.done .dot{
background:#8e2de2;
color:#fff

.orderStatus{
display:inline-block;
background:#eee5ff;
color:#5c16b8;
padding:7px 11px;
border-radius:18px;
font-weight:bold
}

.paymentOption{
display:block;
width:100%;
text-align:left;
padding:13px;
border:1px solid #ddd;
border-radius:12px;
background:#fff;
margin:8px 0
}

.paymentOption.selected{
border:2px solid #6a11cb;
background:#f7f0ff
}

.paymentPrice{
float:right;
font-weight:bold
}

.priceLine{
display:flex;
justify-content:space-between;
gap:10px;
padding:7px 0
}

.totalLine{
font-size:20px;
font-weight:800;
border-top:1px solid #ddd;
padding-top:12px;
margin-top:8px
}

.couponRow{
display:flex;
gap:8px
}

.couponRow input{
flex:1;
padding:11px;
border:1px solid #ccc;
border-radius:10px
}

.reviewCard{
border-top:1px solid #eee;
padding:13px 0
}

.reviewMedia{
font-size:35px;
margin-top:7px
}

.toast{
position:fixed;
top:80px;
right:15px;
z-index:200;
background:#4b0082;
color:#fff;
padding:14px 18px;
border-radius:12px;
box-shadow:0 5px 20px #0003;
max-width:330px
}

.toastBtns{
margin-top:8px;
display:flex;
gap:6px
}

.toastBtns button{
padding:6px 10px;
border-radius:8px
}

.demoLabel{
display:inline-block;
background:#fff0fa;
color:#d41462;
border:1px solid #f4b3cd;
padding:5px 9px;
border-radius:15px;
font-size:12px;
font-weight:bold
}

@media(max-width:650px){

.formgrid{

.navbtn{
padding:8px
}

.logo{
font-size:21px

.photo{
height:135px
}

.grid{
grid-template-columns:repeat(2,1fr)
}

.banner{
flex-direction:column;
align-items:flex-start

.bottom{
overflow-x:auto;
justify-content:flex-start
}

.bottom button{
white-space:nowrap
}

.stickyBuy{
grid-template-columns:1fr 1fr
}

.ratingBox{
align-items:flex-start
}

.track{
overflow-x:auto;
min-width:650px

@media(min-width:651px){
.trackWrap{
overflow:hidden
}

function escapeHTML(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function productNeedsSize(p){

return Array.isArray(p.sizes)&&p.sizes.length>0;

}


function deliveryDate(days=7){

const d=new Date();

d.setDate(d.getDate()+days);

return d.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


function formatDate(dateValue){

if(!dateValue)return"—";

const d=new Date(dateValue);

return d.toLocaleDateString(
"en-IN",
{
day:"numeric",
month:"short",
year:"numeric"
}
);

}


function generateOrderNumber(){

const now=new Date();

const stamp=
now.getFullYear().toString().slice(-2)+
String(now.getMonth()+1).padStart(2,"0")+
String(now.getDate()).padStart(2,"0")+
String(now.getHours()).padStart(2,"0")+
String(now.getMinutes()).padStart(2,"0")+
String(now.getSeconds()).padStart(2,"0");

const random=
Math.floor(100+Math.random()*900);

return"ZC-"+stamp+"-"+random;

}


function productReviews(id){

return reviewsData.filter(
r=>Number(r.productId)===Number(id)
);

}


function productAverage(id,p){

const reviews=productReviews(id);

if(!reviews.length)return p.rating;

const total=reviews.reduce(
(sum,r)=>sum+Number(r.rating||0),
0
);

return(
total/reviews.length
).toFixed(1);

}

function filterPrice(range){

let parts=range
.replaceAll("₹","")
.replaceAll(",","")
.split("–");

let min=parseInt(parts[0]);

let max=parts[1]
?
parseInt(parts[1].replace("+",""))
:
Infinity;

let source=products.filter(
p=>p.cat===selectedCat
);

let result=source.filter(
p=>p.price>=min &&
(
max===Infinity ||
p.price<=max
)
);

if(!result.length){

document.getElementById(
"subcategoryProducts"
).innerHTML=`

<div class="empty">

इस price range में अभी product उपलब्ध नहीं है।

</div>

`;

return;

}

document.getElementById(
"subcategoryProducts"
).innerHTML=
result.map(productCard).join("");

}

function checkoutBaseTotal(){

if(!checkoutState)return 0;

return checkoutState.items.reduce(
(sum,item)=>{

const p=products.find(
x=>x.id===item.id
);

return sum+
(
p?
p.price*Number(item.qty||1)
:0
);

},
0
);

}


function checkoutTotalForPayment(){

const base=checkoutBaseTotal();

let discount=
appliedCoupon
?
Math.min(50,Math.round(base*0.10))
:
0;

let total=base-discount;

if(selectedPayment==="cod"){

total+=50;

}

if(selectedPayment==="online"){

total=Math.max(0,total-40);

}

return{
base,
discount,
total
};

}

const field=document.getElementById("reviewRating");

if(field)field.value=rating;

document.querySelectorAll(".ratingOption").forEach(
b=>b.classList.remove("active")
);

event.target.classList.add("active");

}


function submitReview(productId){

const rating=
document.getElementById("reviewRating")?.value;

const comment=
document.getElementById("reviewComment")?.value.trim();

if(!rating){

alert(
"पहले rating चुनें।"
);

return;

}

const ratingText={
5:"Very Good",
4:"Good",
3:"Okay",
2:"Bad",
1:"Very Bad"
}[rating];

reviewsData.push({

id:Date.now(),

productId:productId,

rating:Number(rating),

ratingText:ratingText,

comment:
comment||
"Customer ने rating दी है।",

photo:false,

video:false,

date:new Date().toISOString()

});

save();

closeModal();

showToast(
"⭐ आपका review successfully save हो गया।"
);

setTimeout(
()=>product(productId),
500
);

}

navigator.share
){

navigator.share({
title:p.name,
text:text
}).catch(()=>{});

}else if(
navigator.clipboard
){

navigator.clipboard.writeText(text);

showToast(

);

}else{

showToast(

);

}

}

function voiceSearch(){

if(!("webkitSpeechRecognition" in window)){

alert(
"इस browser में voice search उपलब्ध नहीं है।"
);

return;

}

let r=
new webkitSpeechRecognition();

r.lang=
currentLang==="English"
?
"en-IN"
:
"hi-IN";

function speak(t){

if("speechSynthesis" in window){

speechSynthesis.cancel();

const u=
new SpeechSynthesisUtterance(t);

u.lang=
currentLang==="English"
?
"en-IN"
:
"hi-IN";

speechSynthesis.speak(u);

}

}


function speakList(a){

a.forEach(

(x,i)=>
setTimeout(

()=>speak(
x.substring(
x.indexOf(" ")+1
)
),

i*900

)

);

}

function setLang(x){

currentLang=x;

localStorage.setItem(
"zipLang",
x
);

closeModal();

showToast(
"🌐 Language saved: "+x
);

}


function openModal(x){

document.getElementById(
"modalbox"
).innerHTML=x;

document.getElementById(
"modal"
).classList.add("show");

}


function closeModal(){

document.getElementById(
"modal"
).classList.remove("show");

}


function showToast(message){

const old=document.getElementById("simpleToast");

if(old)old.remove();

const box=document.createElement("div");

box.id="simpleToast";
box.className="toast";

box.textContent=message;

document.body.appendChild(box);

setTimeout(()=>{

if(box.parentElement)box.remove();

},3500);

}


document.getElementById("modal").addEventListener(
"click",
function(e){

if(e.target===this){
closeModal();
}

}
);


function show(x){

selectedCat=null;

wishlistPageActive=false;

if(x==="home")home();

if(x==="wishlist")wishlistPage();

if(x==="cart")cartPage();

if(x==="orders")orders();

if(x==="account")account();

if(x==="categories")categories();

window.scrollTo(0,0);

}


show("home");

</script>
