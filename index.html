<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipCart — आपकी अपनी Shopping जगह ❤️</title>

<style>
*{box-sizing:border-box}

html{
scroll-behavior:smooth
}

body{
margin:0;
font-family:Arial,"Noto Sans",sans-serif;
background:#f7f7fb;
color:#222
}

button,input,select,textarea{
font:inherit
}

button{
cursor:pointer;
border:0
}

.header{
position:sticky;
top:0;
z-index:50;
background:linear-gradient(135deg,#4b0082,#6a11cb,#e91e63);
color:#fff;
padding:12px
}

.top{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
max-width:1200px;
margin:auto
}

.logo{
font-size:25px;
font-weight:800;
white-space:nowrap
}

.tag{
font-size:11px;
opacity:.95
}

.search{
flex:1;
min-width:220px;
display:flex;
background:#fff;
border-radius:25px;
overflow:hidden
}

.search input{
flex:1;
border:0;
padding:12px 15px;
outline:0
}

.search button{
background:#fff;
padding:0 10px
}

.navbtn{
background:#ffffff22;
color:#fff;
padding:10px 12px;
border-radius:20px;
font-weight:600
}

.navbtn:hover{
background:#ffffff35
}

.count{
display:inline-flex;
min-width:21px;
height:21px;
align-items:center;
justify-content:center;
background:#ff4081;
color:#fff;
border-radius:50%;
font-size:12px;
margin-left:3px
}

.page{
max-width:1200px;
margin:auto;
padding:14px 14px 30px
}

.hero{
background:linear-gradient(135deg,#fff0fa,#eee5ff);
border-radius:20px;
padding:24px;
margin-bottom:16px
}

.hero h1{
margin:0 0 8px;
color:#5c16b8
}

.quick{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:14px
}

.pill{
background:#fff;
border:1px solid #ddd;
padding:9px 13px;
border-radius:20px
}

.pill:hover{
border-color:#8e2de2;
color:#6a11cb
}

.section{
margin:22px 0
}

.section h2{
margin:0 0 12px
}

.hscroll{
display:flex;
gap:14px;
overflow-x:auto;
padding:5px 2px 12px
}

.cat{
min-width:92px;
width:92px;
text-align:center;
flex:none;
cursor:pointer
}

.catpic{
width:78px;
height:78px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:2px solid #eadcff;
box-shadow:0 3px 10px #0001;
font-size:35px;
margin:auto
}

.cat b{
display:block;
font-size:13px;
margin-top:7px
}

.banner{
background:linear-gradient(100deg,#4b0082,#a4508b,#e91e63);
color:#fff;
border-radius:18px;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}

.banner button{
background:#fff;
color:#6812ad;
padding:10px 15px;
border-radius:20px;
font-weight:bold
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:14px
}

.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 10px #0001;
position:relative;
transition:.2s
}

.card:hover{
transform:translateY(-2px);
box-shadow:0 5px 16px #0002
}

.photo{
height:155px;
background:linear-gradient(135deg,#eee,#fafafa);
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
cursor:pointer;
position:relative;
overflow:hidden
}

/* PRODUCT COLOR PREVIEW */

.product-visual{
width:100%;
height:100%;
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
transition:.3s;
position:relative
}

.product-visual:after{
content:"";
position:absolute;
inset:15px;
border-radius:20px;
opacity:.16;
pointer-events:none
}

.color-red{background:linear-gradient(135deg,#fff,#ffe4e8)}.color-red:after{background:#e53935}
.color-pink{background:linear-gradient(135deg,#fff,#ffe5f0)}.color-pink:after{background:#ec4899}
.color-blue{background:linear-gradient(135deg,#fff,#e3efff)}.color-blue:after{background:#2563eb}
.color-green{background:linear-gradient(135deg,#fff,#e4f8ec)}.color-green:after{background:#16a34a}
.color-black{background:linear-gradient(135deg,#fff,#e9e9e9)}.color-black:after{background:#111}
.color-white{background:linear-gradient(135deg,#fff,#f2f2f2)}.color-white:after{background:#fff;border:2px solid #ddd}
.color-yellow{background:linear-gradient(135deg,#fff,#fff5cf)}.color-yellow:after{background:#facc15}
.color-maroon{background:linear-gradient(135deg,#fff,#f8e1e6)}.color-maroon:after{background:#800020}
.color-purple{background:linear-gradient(135deg,#fff,#eee4ff)}.color-purple:after{background:#7c3aed}
.color-golden{background:linear-gradient(135deg,#fff,#fff1b8)}.color-golden:after{background:#d4af37}
.color-silver{background:linear-gradient(135deg,#fff,#e7e7e7)}.color-silver:after{background:#9ca3af}
.color-rose-gold{background:linear-gradient(135deg,#fff,#ffe6df)}.color-rose-gold:after{background:#b76e79}
.color-brown{background:linear-gradient(135deg,#fff,#eee0d2)}.color-brown:after{background:#8b5e3c}
.color-beige{background:linear-gradient(135deg,#fff,#f5ead7)}.color-beige:after{background:#d6c2a1}
.color-grey{background:linear-gradient(135deg,#fff,#e8e8e8)}.color-grey:after{background:#6b7280}
.color-standard{background:linear-gradient(135deg,#eee,#fafafa)}.color-standard:after{background:#8e2de2}

.heart{
position:absolute;
right:8px;
top:8px;
background:#fff;
border-radius:50%;
width:36px;
height:36px;
font-size:20px;
box-shadow:0 2px 7px #0002;
z-index:2
}

.heart.liked{
color:#e91e63
}

.cardbody{
padding:11px
}

.price{
font-size:20px;
font-weight:800
}

.old{
text-decoration:line-through;
color:#888;
font-size:13px;
margin-left:5px
}

.off{
color:#16833c;
font-weight:700;
font-size:13px;
margin-left:5px
}

.rating{
color:#087b36;
font-weight:700;
margin-top:5px
}

.buy{
width:100%;
margin-top:9px;
padding:11px;
border-radius:10px;
background:linear-gradient(135deg,#4b0082,#8e2de2);
color:#fff;
font-weight:bold
}

.buy:hover{
background:linear-gradient(135deg,#6a11cb,#e91e63)
}

.panel{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 2px 12px #0001;
margin-bottom:15px
}

.back{
background:#eee;
padding:9px 14px;
border-radius:18px;
margin-bottom:12px;
cursor:pointer;
display:inline-block;
font-weight:bold
}

.row{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap
}

.grow{
flex:1
}

.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:5px
}

.field input,
.field select,
.field textarea{
padding:11px;
border:1px solid #ccc;
border-radius:10px;
outline:none
}

.field input:focus,
.field select:focus,
.field textarea:focus{
border-color:#8e2de2
}

.field textarea{
min-height:80px
}

.notice{
background:#fff8df;
border:1px solid #efd57c;
border-radius:12px;
padding:12px;
margin:10px 0
}

.empty{
text-align:center;
padding:30px;
background:#fff;
border-radius:18px;
box-shadow:0 2px 10px #0001
}

.qtybox{
display:flex;
align-items:center;
gap:7px
}

.qtybox button{
width:30px;
height:30px;
border-radius:50%;
background:#eee
}

.cartitem{
padding:14px 0;
border-bottom:1px solid #eee
}

.bottom{
position:sticky;
bottom:0;
background:#fff;
border-top:1px solid #ddd;
padding:9px;
display:flex;
justify-content:center;
gap:8px;
z-index:40
}

.bottom button{
background:#f2eff8;
padding:9px 12px;
border-radius:12px
}

.bottom-wishlist{
font-size:24px!important;
width:46px;
height:42px;
padding:6px!important;
display:flex;
align-items:center;
justify-content:center;
line-height:1
}

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px
}

.modalbox{
background:#fff;
border-radius:18px;
max-width:700px;
width:100%;
max-height:90vh;
overflow:auto;
padding:20px
}

.modal.show{
display:flex
}

.track{
display:flex;
justify-content:space-between;
gap:4px;
position:relative;
margin:20px 0
}

.track:before{
content:"";
position:absolute;
top:15px;
left:6%;
right:6%;
height:4px;
background:#ddd
}

.step{
z-index:1;
text-align:center;
font-size:11px;
max-width:90px
}

.dot{
width:30px;
height:30px;
border-radius:50%;
background:#eee;
margin:auto;
padding-top:7px
}

.done .dot{
background:#8e2de2;
color:#fff
}

.product-page{
padding-bottom:150px
}

.product-main{
display:grid;
grid-template-columns:minmax(280px,1fr) minmax(320px,1fr);
gap:18px
}

.sticky-buy{
position:fixed;
left:0;
right:0;
bottom:0;
z-index:80;
background:#fff;
border-top:1px solid #ddd;
box-shadow:0 -4px 18px #0002;
padding:10px 14px
}

.sticky-buy-inner{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.sticky-buy button{
padding:14px;
border-radius:12px;
font-weight:800
}

.sticky-cart{
background:#fff;
border:2px solid #6a11cb!important;
color:#5c16b8
}

.sticky-buy-now{
background:linear-gradient(135deg,#4b0082,#e91e63);
color:#fff
}

.payment-options{
display:flex;
flex-direction:column;
gap:10px;
margin-top:12px
}

.payment-option{
width:100%;
display:flex;
align-items:flex-start;
gap:12px;
border:1px solid #ddd;
border-radius:14px;
padding:14px;
cursor:pointer;
background:#fff;
transition:.15s;
text-align:left
}

.payment-option.selected{
border:2px solid #8e2de2;
background:#faf5ff
}
</style>
</head>

<body>

<header class="header">
<div class="top">
<div>
<div class="logo">🛍️ ZipCart</div>
<div class="tag">आपकी अपनी Shopping जगह ❤️</div>
</div>

<div class="search">
<input id="searchInput" placeholder="क्या ढूँढ रहे हैं? जैसे Anarkali Suit" onkeydown="if(event.key==='Enter')doSearch()">
<button onclick="voiceSearch()">🎤</button>
<button onclick="doSearch()">🔍</button>
</div>

<button class="navbtn" onclick="show('wishlist')">❤️ <span class="count" id="wishCount">0</span></button>
<button class="navbtn" onclick="show('cart')">🛒 Cart <span class="count" id="cartCount">0</span></button>
<button class="navbtn" onclick="show('orders')">📦 मेरे ऑर्डर</button>
<button class="navbtn" onclick="show('account')">👤 Account</button>
<button class="navbtn" onclick="languageModal()">🌐</button>
</div>
</header>

<main class="page" id="app"></main>

<div class="bottom">
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('categories')">🗂️ Categories</button>
<button class="bottom-wishlist" onclick="show('wishlist')">❤️</button>
<button onclick="show('orders')">📦 My Orders</button>
<button onclick="show('account')">👤 Account</button>
</div>

<div class="modal" id="modal">
<div class="modalbox" id="modalbox"></div>
</div>

<script>
const PAYMENT_SETTINGS={ codExtra:50 };

const cats=[
["🚌","Travel Tickets","travel"],
["🧾","Bills & Recharge","bills"],
["💊","Medicines","medicine"],
["🛒","Grocery","grocery"],
["👗","महिलाओं का फैशन","women"],
["👔","Men Fashion","men"],
["🧒","Kids","kids"],
["👟","जूते","shoes"],
["💍","ज्वेलरी","jewellery"],
["👜","बैग","bags"],
["🧸","खिलौने","toys"],
["💄","Beauty","beauty"],
["🏠","घर का सामान","home"],
["🛋️","Furniture","furniture"],
["📱","Electronics","electronics"],
["📚","School Items","school"]
];

const sub={
grocery:[
"🥦 Fresh Vegetables",
"🍎 Fresh Fruits",
"🌾 Atta, Rice, Dal",
"🧂 Oil, Ghee, Masala",
"🍪 Snacks & Biscuits",
"🧃 Beverages & Drinks",
"🧼 Household & Cleaning",
"👶 Baby Care & Personal"
],
women:[
"🥻 Saree", "👗 Suits", "👚 Kurtis", "👖 Jeans", "👕 Tops", "👗 Dresses"
],
men:[
"👔 Shirts", "👕 T-Shirts", "👖 Jeans", "🥻 Kurta", "👖 Trousers/Pants"
]
};

const products=[
{
id:1,
name:"Anarkali Designer Suit",
cat:"women",
price:699,
old:1999,
off:65,
rating:4.4,
reviewsCount:1420,
icon:"👗",
visualColor:"red",
desc:"खूबसूरत कढ़ाई वाला एथनिक अनारकली सूट, जो हर पार्टी और शादी के फंक्शन के लिए बेहतरीन है।",
sizes:["S", "M", "L", "XL", "XXL"],
colors:["Red", "Pink", "Blue", "Maroon", "Golden"],
details:[
"कपड़ा: प्रीमियम जॉर्जेट",
"वर्क: एम्ब्रॉयडरी और सीक्वेंस वर्क",
"दुपट्टा: शिफॉन साथ में"
],
delivery:"3 से 5 दिनों में मुफ़्त डिलीवरी",
returnExchange:"7 दिन की आसान रिटर्न पॉलिसी",
reviews:[
{name:"प्रियंका शर्मा", rating:5, comment:"सूट बहुत ही सुंदर है!", date:"12 Oct 2026"}
]
},
{
id:2,
name:"Men's Casual Cotton Shirt",
cat:"men",
price:449,
old:1299,
off:65,
rating:4.2,
reviewsCount:890,
icon:"👔",
visualColor:"blue",
desc:"आरामदायक सूती कैजुअल शर्ट, ऑफिस और रोजमर्रा के लिए बेस्ट।",
sizes:["M", "L", "XL", "XXL"],
colors:["Blue", "White", "Black", "Grey", "Green"],
details:[
"कपड़ा: 100% शुद्ध कॉटन",
"फिट: रेगुलर फिट"
],
delivery:"2 से 4 दिनों में डिलीवरी",
returnExchange:"7 दिन की आसान वापसी",
reviews:[
{name:"राहुल वर्मा", rating:4, comment:"क्वालिटी अच्छी है।", date:"11 Oct 2026"}
]
}
];

let cart = [];
let wishlist = [];
let orders = [];

function show(page) {
  const app = document.getElementById('app');
  if (page === 'home') {
    app.innerHTML = `
      <div class="hero">
        <h1>ZipCart में आपका स्वागत है ❤️</h1>
        <p>आपकी अपनी shopping जगह — देखो → सुनो → समझो → दबाओ → खरीदो</p>
      </div>
      <div class="section">
        <h2>Top Categories</h2>
        <div class="hscroll">
          ${cats.map(c => `
            <div class="cat" onclick="alert('${c[1]} category clicked!')">
              <div class="catpic">${c[0]}</div>
              <b>${c[1]}</b>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="section">
        <h2>Trending Products</h2>
        <div class="grid">
          ${products.map(p => `
            <div class="card">
              <div class="photo color-${p.visualColor}">
                <div class="product-visual">${p.icon}</div>
                <div class="heart" onclick="toggleWishlist(${p.id})">❤️</div>
              </div>
              <div class="cardbody">
                <b>${p.name}</b>
                <div class="row" style="margin-top:6px">
                  <span class="price">₹${p.price}</span>
                  <span class="old">₹${p.old}</span>
                  <span class="off">${p.off}% off</span>
                </div>
                <div class="rating">⭐ ${p.rating}</div>
                <button class="buy" onclick="addToCart(${p.id})">Add to Cart</button>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else if (page === 'cart') {
    app.innerHTML = `
      <h2>मेरा Cart 🛒</h2>
      ${cart.length === 0 ? '<div class="empty">आपका cart अभी खाली है। ❤️</div>' : '<div>Cart items here...</div>'}
    `;
  } else if (page === 'wishlist') {
    app.innerHTML = `
      <h2>मेरी Wishlist ❤️</h2>
      ${wishlist.length === 0 ? '<div class="empty">Wishlist अभी खाली है। किसी product पर ❤️ दबाइए।</div>' : '<div>Wishlist items here...</div>'}
    `;
  } else if (page === 'orders') {
    app.innerHTML = `<h2>मेरे ऑर्डर 📦</h2><div class="empty">कोई ऑर्डर नहीं मिला।</div>`;
  } else if (page === 'account') {
    app.innerHTML = `<h2>Account 👤</h2><div class="panel">लॉगिन / प्रोफाइल विवरण</div>`;
  } else {
    app.innerHTML = `<h2>${page}</h2><div class="panel">पेज लोड हो रहा है...</div>`;
  }
}

function addToCart(id) {
  cart.push(id);
  document.getElementById('cartCount').innerText = cart.length;
  alert('Product cart में जोड़ दिया गया।');
}

function toggleWishlist(id) {
  if (wishlist.includes(id)) {
    wishlist = wishlist.filter(i => i !== id);
  } else {
    wishlist.push(id);
  }
  document.getElementById('wishCount').innerText = wishlist.length;
}

function voiceSearch() {
  alert('Voice Search चालू है...');
}

function doSearch() {
  const query = document.getElementById('searchInput').value;
  if(query) alert(`ढूँढ रहे हैं: ${query}`);
}

function languageModal() {
  alert('भाषा चयन (Language Modal)');
}

// Initial load
show('home');
</script>

</body>
</html>
