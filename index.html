<style>
*{box-sizing:border-box}

body{
margin:0;

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}

.header{

.top{

.logo{

.tag{

.search{

.search button{

.navbtn{

.count{

justify-content:center;

.page{
max-width:1200px;

background:linear-gradient(135deg,#fff0fa,#eee5ff);

margin:0 0 8px;

}

.quick{
display:flex;

.pill{
background:#fff;

.pill:hover{
border-color:#8e2de2;

.section{
margin:22px 0

.section h2{
margin:0 0 12px

.hscroll{
display:flex;

.cat{

.catpic{
width:78px;
height:78px;

justify-content:center;

padding:18px;

.banner button{
background:#fff;
color:#6812ad;
padding:10px 15px;
border-radius:20px;
font-weight:bold
}

.grid{
display:grid;

.card{
background:#fff;
border-radius:16px;

height:155px;

align-items:center;
justify-content:center;

position:absolute;

height:36px;

.cardbody{

.price{

.old{

.off{

margin-left:5px

align-items:center;

.grow{
flex:1

.formgrid{
display:grid;

.field{
display:flex;

gap:5px

.field input,
.field select,

.field textarea{

.notice{

padding:12px;

.empty{

padding:30px;

.qtybox{

align-items:center;

.qtybox button{
width:30px;
height:30px;

.cartitem{

.cartitem:last-child{

.selectrow{

.bottom{

bottom:0;
background:#fff;

padding:9px;
display:flex;
justify-content:center;

background:#f2eff8;
padding:9px 12px;

.bottom button:hover{

.modal{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px

.modalbox{
background:#fff;
border-radius:18px;
max-width:700px;
width:100%;

overflow:auto;
padding:20px

.modal.show{
display:flex

.track{
display:flex;
justify-content:space-between;
gap:4px;
position:relative;
margin:20px 0
}

.track:before{
content:"";
position:absolute;
top:15px;
left:6%;
right:6%;
height:4px;
background:#ddd
}

.step{
z-index:1;
text-align:center;
font-size:11px;
max-width:90px
}

.dot{
width:30px;
height:30px;
border-radius:50%;
background:#eee;
margin:auto;
padding-top:7px

.navbtn{

.logo{

.grid{

.banner{

align-items:flex-start

.bottom{
overflow-x:auto;
justify-content:flex-start

.bottom button{
white-space:nowrap

function save(){

"zipWish",
JSON.stringify(wishlist)
);

localStorage.setItem(
"zipCart",
JSON.stringify(cart)
);

updateCounts();

}


function updateCounts(){

document.getElementById("wishCount").textContent=
wishlist.length;

document.getElementById("cartCount").textContent=
cart.reduce(
(total,item)=>total+Number(item.qty||0),
0
);

}


function productCard(p){

const liked=wishlist.includes(p.id);

const pct=Math.round(
(1-p.price/p.old)*100
);

return `

<div class="card">

<button
class="heart ${liked?"liked":""}"
onclick="toggleWish(${p.id})"
>
${liked?"❤️":"♡"}
</button>

<div
class="photo"
onclick="product(${p.id})"
style="cursor:pointer"
>
${p.emoji}
</div>

<div>

<span class="price">
₹${p.price}
</span>

<span class="old">

</span>

</div>

<div class="rating">

</div>

<button
class="buy"
onclick="product(${p.id})"
>
देखें / खरीदें
</button>

</div>

</div>

`;

}

function filterPrice(range){

let parts=range
.replaceAll("₹","")
.replaceAll(",","")
.split("–");

let min=parseInt(parts[0]);

let max=parts[1]
?
parseInt(parts[1].replace("+",""))
:
Infinity;

let source=products.filter(
p=>p.cat===selectedCat
);

let result=source.filter(
p=>p.price>=min &&
(
max===Infinity ||
p.price<=max
)
);

if(!result.length){

document.getElementById(
"subcategoryProducts"
).innerHTML=`

<div class="empty">

इस price range में अभी product उपलब्ध नहीं है।

</div>

`;

return;

}

document.getElementById(
"subcategoryProducts"
).innerHTML=
result.map(productCard).join("");

}
