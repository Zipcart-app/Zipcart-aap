.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{background:#fff;border:1px solid #ddd;padding:9px 13px;border-radius:20px}

.section{margin:22px 0}
.section h2{margin:0 0 12px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:5px 2px 12px}
.cat{min-width:92px;width:92px;text-align:center;flex:none;cursor:pointer}
.catpic{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #eadcff;box-shadow:0 3px 10px #0001;font-size:35px;margin:auto}

.banner{background:linear-gradient(100deg,#4b0082,#a4508b,#e91e63);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.banner button{background:#fff;color:#6812ad;padding:10px 15px;border-radius:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;position:relative;transition:.2s}
.card:hover{transform:translateY(-2px);box-shadow:0 5px 16px #0002}
.photo{height:155px;background:linear-gradient(135deg,#eee,#fafafa);display:flex;align-items:center;justify-content:center;font-size:70px;cursor:pointer;position:relative;overflow:hidden}
.product-visual{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:70px;transition:.3s;position:relative}

.color-pink{background:linear-gradient(135deg,#fff,#ffe5f0)}.color-pink:after{background:#ec4899}

.color-green{background:linear-gradient(135deg,#fff,#e4f8ec)}.color-green:after{background:#16a34a}
.color-black{background:linear-gradient(135deg,#fff,#e9e9e9)}.color-black:after{background:#111}
.color-white{background:linear-gradient(135deg,#fff,#f2f2f2)}.color-white:after{background:#fff;border:2px solid #ddd}
.color-yellow{background:linear-gradient(135deg,#fff,#fff5cf)}.color-yellow:after{background:#facc15}
.color-maroon{background:linear-gradient(135deg,#fff,#f8e1e6)}.color-maroon:after{background:#800020}
.color-purple{background:linear-gradient(135deg,#fff,#eee4ff)}.color-purple:after{background:#7c3aed}
.color-golden{background:linear-gradient(135deg,#fff,#fff1b8)}.color-golden:after{background:#d4af37}
.color-silver{background:linear-gradient(135deg,#fff,#e7e7e7)}.color-silver:after{background:#9ca3af}
.color-rose-gold{background:linear-gradient(135deg,#fff,#ffe6df)}.color-rose-gold:after{background:#b76e79}
.color-brown{background:linear-gradient(135deg,#fff,#eee0d2)}.color-brown:after{background:#8b5e3c}
.color-beige{background:linear-gradient(135deg,#fff,#f5ead7)}.color-beige:after{background:#d6c2a1}
.color-grey{background:linear-gradient(135deg,#fff,#e8e8e8)}.color-grey:after{background:#6b7280}
.color-standard{background:linear-gradient(135deg,#eee,#fafafa)}.color-standard:after{background:#8e2de2}
.color-label{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#ffffffdd;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;z-index:2;white-space:nowrap;box-shadow:0 2px 6px #0002}
.heart{position:absolute;right:8px;top:8px;background:#fff;border-radius:50%;width:36px;height:36px;font-size:20px;box-shadow:0 2px 7px #0002;z-index:2}
.heart.liked{color:#e91e63}
.cardbody{padding:11px}
.price{font-size:20px;font-weight:800}
.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:5px}
.off{color:#16833c;font-weight:700;font-size:13px;margin-left:5px}
.rating{color:#087b36;font-weight:700;margin-top:5px}
.buy{width:100%;margin-top:9px;padding:11px;border-radius:10px;background:linear-gradient(135deg,#4b0082,#8e2de2);color:#fff;font-weight:bold}
.buy:hover{background:linear-gradient(135deg,#6a11cb,#e91e63)}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:15px}
.back{background:#eee;padding:9px 14px;border-radius:18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.field textarea{padding:11px;border:1px solid #ccc;border-radius:10px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#8e2de2}
.field textarea{min-height:80px}
.notice{background:#fff8df;border:1px solid #efd57c;border-radius:12px;padding:12px;margin:10px 0}
.empty{text-align:center;padding:30px;background:#fff;border-radius:18px;box-shadow:0 2px 10px #0001}

/* QUANTITY */
.qtybox{display:flex;align-items:center;gap:7px;margin-top:5px}
.qtybox button{width:30px;height:30px;border-radius:50%;background:#eee;font-weight:bold}
.qtybox:focus{outline:2px solid #8e2de2;outline-offset:3px;border-radius:20px}

.cartitem{padding:14px 0;border-bottom:1px solid #eee;cursor:pointer}
.cartitem:last-child{border-bottom:0}
.selectrow{display:flex;align-items:center;gap:8px}
.product-link{cursor:pointer}
.product-link:hover{color:#6a11cb}

.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;justify-content:center;gap:8px;z-index:40}
.bottom button{background:#f2eff8;padding:9px 12px;border-radius:12px}
.bottom button:hover{background:#eadcff;color:#5c16b8}
.bottom-wishlist{font-size:24px!important;width:46px;height:42px;padding:6px!important;display:flex;align-items:center;justify-content:center;line-height:1}

.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.modalbox{background:#fff;border-radius:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal.show{display:flex}
.track{display:flex;justify-content:space-between;gap:4px;position:relative;margin:20px 0}
.track:before{content:"";position:absolute;top:15px;left:6%;right:6%;height:4px;background:#ddd}
.step{z-index:1;text-align:center;font-size:11px;max-width:90px}
.dot{width:30px;height:30px;border-radius:50%;background:#eee;margin:auto;padding-top:7px}
.done .dot{background:#8e2de2;color:#fff}

.product-page{padding-bottom:150px}
.product-main{display:grid;grid-template-columns:minmax(280px,1fr) minmax(320px,1fr);gap:18px}
.product-photo-large{min-height:360px;border-radius:20px;background:linear-gradient(135deg,#eee,#fff);display:flex;align-items:center;justify-content:center;font-size:130px;box-shadow:0 2px 12px #0001;position:relative;overflow:hidden;transition:.3s}
.product-photo-large .product-visual{font-size:130px}
.product-info h1{margin-top:0}
.rating-box{display:flex;align-items:center;gap:10px;margin:12px 0}
.rating-badge{background:#ff4081;color:#fff;font-weight:800;padding:7px 12px;border-radius:10px;font-size:16px}
.rating-count{color:#666}
.option-title{font-weight:800;margin-top:18px;margin-bottom:8px}
.size-list,.color-list{display:flex;gap:8px;flex-wrap:wrap}
.size-btn,.color-btn{background:#fff;border:1px solid #bbb;padding:9px 14px;border-radius:9px}
.size-btn.active,.color-btn.active{border:2px solid #8e2de2;background:#f4eaff;color:#5c16b8;font-weight:bold}
.size-btn.disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.delivery-box{background:#faf6ff;border:1px solid #eadcff;padding:13px;border-radius:12px;margin-top:15px}
.highlight-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.highlight{background:#fafafa;border-radius:12px;padding:12px;border:1px solid #eee}
.rating-summary{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center}
.rating-big{text-align:center;background:#fff0f7;border-radius:18px;padding:20px}
.rating-big .number{font-size:40px;font-weight:900;color:#ff4081}
.rating-choice{display:flex;gap:7px;flex-wrap:wrap}
.rating-choice button{background:#fff;border:1px solid #ddd;border-radius:12px;padding:9px 12px}
.rating-choice button:hover{border-color:#ff4081;color:#e91e63}
.review{border-top:1px solid #eee;padding:14px 0}
.review:first-child{border-top:0}
.review-media{background:#fafafa;border-radius:10px;padding:10px;margin-top:8px}
.sticky-buy{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff;border-top:1px solid #ddd;box-shadow:0 -4px 18px #0002;padding:10px 14px}
.sticky-buy-inner{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sticky-buy button{padding:14px;border-radius:12px;font-weight:800}
.sticky-cart{background:#fff;border:2px solid #6a11cb!important;color:#5c16b8}
.sticky-buy-now{background:linear-gradient(135deg,#4b0082,#e91e63);color:#fff}
.checkout-step{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.checkout-number{width:30px;height:30px;border-radius:50%;background:#6a11cb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;flex:none}

.payment-options{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.payment-option{width:100%;display:flex;align-items:flex-start;gap:12px;border:1px solid #ddd;border-radius:14px;padding:14px;margin:0;cursor:pointer;background:#fff;transition:.15s;min-height:70px;text-align:left;overflow:hidden}
.payment-option:hover{border-color:#b58be8;background:#fcf9ff}
.payment-option.selected{border:2px solid #8e2de2;background:#faf5ff;padding:13px}
.payment-radio{width:19px;height:19px;margin:2px 0 0;flex:none;accent-color:#8e2de2}
.payment-icon{width:36px;height:36px;border-radius:10px;background:#f2eaff;display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}
.payment-content{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.payment-title{font-weight:800;font-size:15px;line-height:1.35;word-break:break-word}
.payment-description{font-size:13px;line-height:1.45;color:#666;white-space:normal;overflow-wrap:anywhere}
.payment-adjustment{display:inline-flex;align-self:flex-start;font-size:12px;font-weight:700;padding:4px 8px;border-radius:12px;background:#fff0f7;color:#e91e63;line-height:1.3;white-space:normal;overflow-wrap:anywhere}
.payment-option.selected .payment-adjustment{background:#eee2ff;color:#6a11cb}
.price-line{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;padding:7px 0}
.price-line span:last-child{text-align:right;white-space:nowrap}
.total-line{display:flex;justify-content:space-between;align-items:flex-start;gap:15px;font-size:21px;font-weight:900;padding-top:10px;border-top:1px solid #ddd}
.total-line span:last-child{white-space:nowrap}
.success-box{background:#effff5;border:1px solid #8dd9a9;border-radius:16px;padding:20px;text-align:center}
.order-card{cursor:pointer}
.order-card:hover{border-color:#8e2de2}
.reason-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.reason-btn{background:#fff;border:1px solid #ddd;padding:11px;border-radius:10px;text-align:left}
.reason-btn.active{border:2px solid #e91e63;background:#fff0f7}
.demo-label{display:inline-block;background:#fff0f7;color:#e91e63;border:1px solid #ffb5d0;padding:5px 9px;border-radius:15px;font-size:12px;font-weight:bold;margin-bottom:8px}
.color-preview-info{margin-top:10px;background:#faf6ff;border:1px solid #eadcff;border-radius:12px;padding:10px;font-size:13px;color:#5c16b8}
.color-dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:5px;border:1px solid #aaa}
.dot-Red{background:#e53935}.dot-Pink{background:#ec4899}.dot-Blue{background:#2563eb}.dot-Green{background:#16a34a}.dot-Black{background:#111}.dot-White{background:#fff}.dot-Yellow{background:#facc15}.dot-Maroon{background:#800020}.dot-Purple{background:#7c3aed}.dot-Golden{background:#d4af37}.dot-Silver{background:#c0c0c0}.dot-Rose-Gold{background:#b76e79}.dot-Brown{background:#8b5e3c}.dot-Beige{background:#d6c2a1}.dot-Grey{background:#6b7280}.dot-Standard{background:#8e2de2}
.sort-active{background:#eadcff;color:#5c16b8;border-color:#8e2de2;font-weight:bold}

@media(max-width:800px){
.product-main{grid-template-columns:1fr}
.product-photo-large{min-height:280px;font-size:100px}
.product-photo-large .product-visual{font-size:100px}
.rating-summary{grid-template-columns:1fr}
}
@media(max-width:650px){
.formgrid{grid-template-columns:1fr}
.navbtn{padding:8px}
.logo{font-size:21px}
.photo{height:135px}
.grid{grid-template-columns:repeat(2,1fr)}
.banner{flex-direction:column;align-items:flex-start}
.bottom{overflow-x:auto;justify-content:flex-start}
.bottom button{white-space:nowrap}
.bottom .bottom-wishlist{white-space:normal;flex:none}
.highlight-list{grid-template-columns:1fr}
.reason-grid{grid-template-columns:1fr}
.sticky-buy-inner{grid-template-columns:1fr 1fr}
.product-page{padding-bottom:175px}
.payment-option{padding:12px;gap:9px}
.payment-option.selected{padding:11px}
.payment-icon{width:32px;height:32px;font-size:19px}
.payment-title{font-size:14px}
.payment-description{font-size:12px}
.payment-adjustment{font-size:11px}
.price-line{font-size:14px}
.total-line{font-size:19px}
}
</style>
</head>

w=w.map(id=>map[id]!==undefined?map[id]:Number(id));
c=c.map(item=>({...item,id:map[Number(item.id)]!==undefined?map[Number(item.id)]:Number(item.id)}));
localStorage.setItem("zipWish",JSON.stringify([...new Set(w)]));
localStorage.setItem("zipCart",JSON.stringify(c));
}

/* पुराने quantity को सिर्फ एक बार ठीक करना */
function fixOldQuantities(){
if(localStorage.getItem("zipQtyFixedV1")==="1")return;
let saved=JSON.parse(localStorage.getItem("zipCart")||"[]");
saved=saved.map(item=>{
let q=Number(item.qty);
if(!Number.isFinite(q)||q<1)q=1;
q=Math.floor(q);
if(q%2===1)q=(q+1)/2;
return {...item,qty:Math.max(1,q)};
});
localStorage.setItem("zipCart",JSON.stringify(saved));
localStorage.setItem("zipQtyFixedV1","1");
}
fixOldQuantities();

function isCashPayment(method){return method==="Cash on Delivery"}
function isOnlinePayment(method){return !isCashPayment(method)}
function getPaymentAdjustment(method){return isCashPayment(method)?PAYMENT_SETTINGS.codExtra:0}
function getFinalAmount(subtotal,method){return Math.max(0,subtotal+getPaymentAdjustment(method))}

function colorClass(color){
if(!color)return"color-standard";
let k=String(color).trim().toLowerCase().replace(/\s+/g,"-");
let a=["red","pink","blue","green","black","white","yellow","maroon","purple","golden","silver","rose-gold","brown","beige","grey","standard"];
return a.includes(k)?"color-"+k:"color-standard";
}

function colorDotClass(color){
if(!color)return"dot-Standard";
return"dot-"+String(color).trim().replace(/\s+/g,"-");
}

function productVisual(p,color=""){
let selected=color||p.colors?.[0]||"Standard";
return `<div class="product-visual ${colorClass(selected)}"><span>${p.emoji}</span><span class="color-label">${escapeHTML(selected)}</span></div>`;

function filterPrice(range){
let parts=range.replaceAll("₹","").replaceAll(",","").split("–");
let min=parseInt(parts[0]),max=parts[1]?parseInt(parts[1].replace("+","")):Infinity;
let result=products.filter(p=>p.cat===selectedCat&&p.price>=min&&(max===Infinity||p.price<=max));
document.getElementById("subcategoryProducts").innerHTML=result.length?result.map(productCard).join(""):`<div class="empty">इस price range में अभी product उपलब्ध नहीं है।</div>`;
}

let activeQtyIndex=null;

function handleQtyKey(event,i){

activeQtyIndex=i;

if(event.key==="+"||event.key==="="||event.key==="ArrowUp"){
event.preventDefault();
event.stopPropagation();
qty(i,1);
return;
}

if(event.key==="-"||event.key==="ArrowDown"){
event.preventDefault();
event.stopPropagation();
qty(i,-1);
return;
}

}

function refocusQty(i){

setTimeout(()=>{

const box=document.querySelector(
`.qtybox[data-qty-index="${i}"]`
);

if(box){
box.focus();
activeQtyIndex=i;
}

},0);

}

function qty(i,d){

cartPage();

function generateOrderNumber(){
const d=new Date(),part=String(d.getFullYear()).slice(-2)+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"),random=Math.floor(100000+Math.random()*900000);

function placeOrder(){
const name=checkoutCustomer.name||"ZipCart Customer",mobile=checkoutCustomer.mobile||"9876543210",address=checkoutCustomer.address||"Demo Address",pin=checkoutCustomer.pin||"302001";
let items=[];
if(checkoutSource==="cart")items=cart.filter(x=>x.selected!==false).map(x=>({id:x.id,qty:Number(x.qty||1)}));
else items=[{id:checkoutProductId,qty:1}];
if(!items.length){alert("Order के लिए product नहीं मिला।");return}
let subtotal=items.reduce((sum,x)=>{const p=getProduct(x.id);return sum+(p?p.price:0)*x.qty},0);
let finalAmount=getFinalAmount(subtotal,selectedPayment);
let d=new Date();d.setDate(d.getDate()+7);
const order={id:generateOrderNumber(),items,name,mobile,address,pin,payment:selectedPayment,subtotal,finalAmount,date:new Date().toLocaleDateString("en-IN"),deliveryDate:d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}),status:"Order Placed",cancelled:false,returned:false,exchanged:false};
ordersData.unshift(order);

if(checkoutSource==="cart"){
let ids=new Set(items.map(x=>x.id));cart=cart.filter(x=>!ids.has(x.id));
}else cart=cart.filter(x=>x.id!==checkoutProductId);

save();showOrderSuccess(order);
}

const p=getProduct(order.items[0].id);
app.innerHTML=`<button class="back" onclick="orders()">← My Orders</button><div class="panel"><h2>🔄 Exchange</h2><p>${p?p.name:"Product"} के लिए नया size/color चुनें।</p>
<div class="option-title">New Size</div><div class="size-list">${(p?.sizes||["S","M","L","XL","XXL"]).map(size=>`<button class="size-btn" data-exchange-size="${size}" onclick="selectExchangeSize(this)">${size}</button>`).join("")}</div>
<div class="option-title">New Color</div><div class="color-list">${(p?.colors||["Red","Blue","Black"]).map(color=>`<button class="color-btn" data-exchange-color="${color}" onclick="selectExchangeColor(this)"><span class="color-dot ${colorDotClass(color)}"></span>${color}</button>`).join("")}</div>
<div class="notice">🔐 Exchange pickup/delivery के समय production version में Exchange OTP verify होगा।</div><button class="buy" onclick="submitExchange()">Submit Exchange Request</button></div>`;
}

function selectExchangeSize(btn){exchangeSize=btn.dataset.exchangeSize;document.querySelectorAll("[data-exchange-size]").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}
function selectExchangeColor(btn){exchangeColor=btn.dataset.exchangeColor;document.querySelectorAll("[data-exchange-color]").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}

function submitExchange(){
if(!exchangeSize&&!exchangeColor){alert("कृपया नया Size या Color चुनें।");return}
const order=ordersData.find(x=>x.id===currentExchangeOrderId);if(!order)return;
order.exchanged=true;order.status="Exchange Requested";order.exchangeSize=exchangeSize;order.exchangeColor=exchangeColor;save();
openModal(`<div class="success-box"><h2>🔄 Exchange Request Submitted</h2><p>Order #${order.id}</p><p>New Size: <b>${exchangeSize||"Same"}</b></p><p>New Color: <b>${exchangeColor||"Same"}</b></p><p>Exchange OTP production flow में generate होगा।</p><button class="buy" onclick="closeModal();orders()">My Orders</button></div>`);
}

function cancelOrder(orderId){
const order=ordersData.find(x=>x.id===orderId);if(!order)return;
let reasons=["Product नहीं चाहिए","गलती से order हो गया","Price बदल गया","Delivery बहुत late हो रही है","Other"];
openModal(`<h2>❌ Cancel Order</h2><p>Order #${order.id}</p><select id="cancelReason">${reasons.map(r=>`<option>${r}</option>`).join("")}</select><br><br><button class="buy" onclick="confirmCancelOrder('${orderId}')">Cancel Order Confirm करें</button><br><br><button class="back" onclick="closeModal()">बंद करें</button>`);
}

function confirmCancelOrder(orderId){
const order=ordersData.find(x=>x.id===orderId);if(!order)return;
order.cancelled=true;order.status="Cancelled";order.cancelReason=document.getElementById("cancelReason")?.value||"";
save();closeModal();alert("Order #"+order.id+" cancel request save हो गई।");orders();
}

function openReviewFromOrder(orderId){
const order=ordersData.find(x=>x.id===orderId);if(!order)return;
openReviewForm(order.items[0].id,"Very Good");
}

/* =========================================================
   ACCOUNT / CATEGORIES / SEARCH
   ========================================================= */

function account(){
app.innerHTML=`<h2>👤 मेरी ZipCart</h2><div class="grid">${["📦 Orders","❤️ Wishlist","🛒 Cart","🏠 Addresses","💳 Payments","🎟️ Coupons","⭐ Reviews","↩️ Returns & Refunds","🔔 Notifications","🆘 Help & Support","🌐 Language","⚙️ Accessibility","🔐 Login/OTP","🚪 Logout"].map(x=>`<button class="panel" onclick="accountAction('${x}')">${x}</button>`).join("")}</div>`;
updateCounts();
}

function accountAction(name){
if(name==="❤️ Wishlist"){show("wishlist");return}
if(name==="🛒 Cart"){show("cart");return}
if(name==="📦 Orders"){show("orders");return}
if(name==="🌐 Language"){languageModal();return}
if(name==="⭐ Reviews"){
app.innerHTML=`<button class="back" onclick="account()">← Account</button><h2>⭐ My Reviews</h2>${reviewsData.length?reviewsData.map(r=>{const p=getProduct(r.productId);return`<div class="panel"><h3>${p?p.name:"Product"}</h3><div>Rating: <b>${r.rating}</b></div><p>${escapeHTML(r.comment||"No comment")}</p></div>`}).join(""):`<div class="empty">अभी कोई review नहीं है।</div>`}`;
return;
}
alert(name+": यह feature production backend में जुड़ेगा।");
}

function categories(){
app.innerHTML=`<button class="back" onclick="show('home')">← Home</button><h2>🗂️ सभी Categories</h2>${catsHTML()}`;
}

function searchPage(q){
let ps=products.filter(p=>(p.name+" "+p.sub+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
app.innerHTML=`<button class="back" onclick="show('home')">← Home</button><div class="panel"><h2>🔎 Search: “${escapeHTML(q)}”</h2><p>${ps.length?ps.length+" विकल्प मिले":"कोई exact result नहीं मिला — Similar products देखें।"}</p>
<div class="quick">
<button class="pill" onclick="searchSort('default',${JSON.stringify(q)})">Default</button>
<button class="pill" onclick="searchSort('low',${JSON.stringify(q)})">Price Low-High</button>
<button class="pill" onclick="searchSort('high',${JSON.stringify(q)})">Price High-Low</button>
<button class="pill" onclick="searchRating(${JSON.stringify(q)})">Top Rated</button>
<button class="pill" onclick="alert('Color filter product catalog में seller data जुड़ने के बाद लागू होगा।')">Color</button>
<button class="pill" onclick="alert('Brand filter production catalog में लागू होगा।')">Brand</button>
<button class="pill" onclick="alert('Seller filter production catalog में लागू होगा।')">Seller</button>
<button class="pill" onclick="alert('Discount filter product catalog में लागू होगा।')">Discount</button>
</div></div>
<div id="searchResults" class="grid">${(ps.length?ps:products).map(productCard).join("")}</div>
<div class="notice">🔔 Price Drop और Back in Stock alerts production version में notification system से जुड़ेंगे।</div>`;
updateCounts();
}

function searchSort(type,q){
let ps=products.filter(p=>(p.name+" "+p.sub+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
if(type==="low")ps.sort((a,b)=>a.price-b.price);
if(type==="high")ps.sort((a,b)=>b.price-a.price);
let box=document.getElementById("searchResults");if(box)box.innerHTML=(ps.length?ps:products).map(productCard).join("");
}

function searchRating(q){
let ps=products.filter(p=>(p.name+" "+p.sub+" "+p.cat).toLowerCase().includes(q.toLowerCase()));
ps.sort((a,b)=>b.rating-a.rating);
let box=document.getElementById("searchResults");if(box)box.innerHTML=(ps.length?ps:products).map(productCard).join("");
}

function doSearch(){let q=document.getElementById("search").value.trim();if(q)searchPage(q)}
function doSearchText(q){document.getElementById("search").value=q;searchPage(q)}

function voiceSearch(){
if(!("webkitSpeechRecognition"in window)){alert("इस browser में voice search उपलब्ध नहीं है।");return}
let r=new webkitSpeechRecognition();r.lang="hi-IN";
r.onresult=e=>{let q=e.results[0][0].transcript;document.getElementById("search").value=q;searchPage(q)};
r.start();
}

function speak(t){
if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=currentLang==="English"?"en-IN":"hi-IN";speechSynthesis.speak(u)}
}

function speakList(a){a.forEach((x,i)=>setTimeout(()=>speak(x.substring(x.indexOf(" ")+1)),i*900))}

function languageModal(){
openModal(`<h2>🌐 भाषा चुनें</h2><p>आपकी पसंद याद रखी जाएगी।</p><div class="quick">${["Hindi","English","Gujarati","Marathi","Bengali","Tamil","Telugu","Kannada","Malayalam","Punjabi","Odia","Assamese","Urdu","Nepali","Maithili","Konkani"].map(x=>`<button class="pill" onclick="setLang('${x}')">${x}</button>`).join("")}</div><br><button class="back" onclick="closeModal()">बंद करें</button>`);
}

function setLang(x){currentLang=x;localStorage.setItem("zipLang",x);closeModal();alert("Language saved: "+x+" — full translation layer production version में जोड़ी जाएगी.")}

function openModal(x){document.getElementById("modalbox").innerHTML=x;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}

function escapeHTML(value){
return String(value).replaceAll("&","&").replaceAll("<","<").replaceAll(">",">").replaceAll('"',""").replaceAll("'","'");
}

function show(x){
selectedCat=null;wishlistPageActive=false;
if(x==="home")home();
if(x==="wishlist")wishlistPage();
if(x==="cart")cartPage();
if(x==="orders")orders();
if(x==="account")account();
if(x==="categories")categories();
window.scrollTo(0,0);
}

show("home");

</script>
</body>
