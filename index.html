<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipCart — आपकी अपनी Shopping जगह ❤️</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
font-family:Arial,"Noto Sans",sans-serif;
background:#faf7ff;
color:#222
}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.header{
position:sticky;
top:0;
z-index:50;
background:linear-gradient(135deg,#4b0082,#6a11cb,#e91e63);
color:#fff;
padding:12px
}
.top{
display:flex;
align-items:center;
gap:10px;
flex-wrap:wrap;
max-width:1200px;
margin:auto
}
.logo{font-size:25px;font-weight:800;white-space:nowrap}
.tag{font-size:11px;opacity:.95}
.search{
flex:1;
min-width:220px;
display:flex;
background:#fff;
border-radius:25px;
overflow:hidden;
cursor:pointer
}
.search input{
flex:1;
border:0;
padding:12px 15px;
outline:0;
background:transparent
}
.search button{
background:#fff;
padding:0 10px
}
.navbtn{
background:#ffffff25;
color:#fff;
padding:10px 12px;
border-radius:20px;
font-weight:600
}
.page{
max-width:1200px;
margin:auto;
padding:14px
}
.hero{
background:linear-gradient(135deg,#fff0fa,#eee5ff);
border-radius:20px;
padding:24px;
margin-bottom:16px
}
.hero h1{
margin:0 0 8px;
color:#5b21b6
}
.quick{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:14px
}
.pill{
background:#fff;
border:1px solid #ddd;
padding:9px 13px;
border-radius:20px
}
.section{margin:22px 0}
.section h2{margin:0 0 12px}
.hscroll{
display:flex;
gap:14px;
overflow-x:auto;
padding:5px 2px 12px
}
.cat{
min-width:92px;
width:92px;
text-align:center;
flex:none
}
.catpic{
width:78px;
height:78px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:2px solid #eadcff;
box-shadow:0 3px 10px #0001;
font-size:35px;
margin:auto
}
.cat b{
display:block;
font-size:13px;
margin-top:7px
}
.banner{
background:linear-gradient(100deg,#4b0082,#e91e63);
color:#fff;
border-radius:18px;
padding:18px;
display:flex;
justify-content:space-between;
align-items:center;
gap:15px
}
.banner button{
background:#fff;
color:#6812ad;
padding:10px 15px;
border-radius:20px;
font-weight:bold
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:14px
}
.card{
background:#fff;
border-radius:16px;
overflow:hidden;
box-shadow:0 2px 10px #0001;
position:relative
}
.photo{
height:155px;
background:linear-gradient(135deg,#eee,#fafafa);
display:flex;
align-items:center;
justify-content:center;
font-size:70px;
cursor:pointer
}
.heart{
position:absolute;
right:8px;
top:8px;
background:#fff;
border-radius:50%;
width:36px;
height:36px;
font-size:20px;
box-shadow:0 2px 7px #0002;
z-index:2
}
.cardbody{padding:11px}
.price{
font-size:20px;
font-weight:800
}
.old{
text-decoration:line-through;
color:#888;
font-size:13px;
margin-left:5px
}
.off{
color:#16833c;
font-weight:700;
font-size:13px;
margin-left:5px
}
.rating{
color:#087b36;
font-weight:700;
margin-top:5px
}
.cardActions{
display:flex;
gap:6px;
margin-top:9px
}
.cardActions button{
flex:1;
padding:8px 4px;
border-radius:8px;
font-size:12px;
font-weight:bold;
text-align:center
}
.btn-add{
background:#f0e6ff;
color:#5b21b6
}
.btn-buy{
background:#6a11cb;
color:#fff
}
.panel{
background:#fff;
border-radius:18px;
padding:18px;
box-shadow:0 2px 12px #0001;
margin-bottom:15px
}
.back{
background:#eee;
padding:9px 14px;
border-radius:18px;
margin-bottom:12px;
font-weight:bold
}
.row{
display:flex;
gap:10px;
align-items:center;
flex-wrap:wrap
}
.grow{flex:1}
.formgrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.field{
display:flex;
flex-direction:column;
gap:5px
}
.field input,
.field select,
.field textarea{
padding:11px;
border:1px solid #ccc;
border-radius:10px
}
.field textarea{min-height:80px}
.modal{
position:fixed;
inset:0;
background:#0008;
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:15px
}
.modalbox{
background:#fff;
border-radius:18px;
max-width:700px;
width:100%;
max-height:90vh;
overflow:auto;
padding:20px
}
.modal.show{display:flex}
.track{
display:flex;
justify-content:space-between;
gap:4px;
position:relative;
margin:20px 0
}
.track:before{
content:"";
position:absolute;
top:15px;
left:6%;
right:6%;
height:4px;
background:#ddd
}
.step{
z-index:1;
text-align:center;
font-size:11px;
max-width:90px
}
.dot{
width:30px;
height:30px;
border-radius:50%;
background:#eee;
margin:auto;
padding-top:7px
}
.done .dot{
background:#6a11cb;
color:#fff
}
.notice{
background:#fff8df;
border:1px solid #efd57c;
border-radius:12px;
padding:12px;
margin:10px 0
}
.bottom{
position:sticky;
bottom:0;
background:#fff;
border-top:1px solid #ddd;
padding:9px;
display:flex;
justify-content:center;
gap:8px;
z-index:40
}
.bottom button{
background:#f2eff8;
padding:9px 12px;
border-radius:12px
}
.lang-active{
background:#6a11cb!important;
color:#fff!important
}
.rtl{
direction:rtl;
text-align:right
}
.thumb-row{
display:flex;
gap:10px;
margin-top:10px;
overflow-x:auto
}
.thumb{
width:60px;
height:60px;
border:2px solid #ddd;
border-radius:8px;
display:flex;
align-items:center;
justify-content:center;
font-size:30px;
cursor:pointer
}
.thumb.active{border-color:#6a11cb}
@media(max-width:650px){
.formgrid{grid-template-columns:1fr}
.navbtn{padding:8px}
.logo{font-size:21px}
.photo{height:135px}
.grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header class="header">
<div class="top">

<div>
<div class="logo">🛍️ ZipCart</div>
<div class="tag" id="tagline"></div>
</div>

<div class="search" onclick="document.getElementById('searchInput').focus()">
<input id="searchInput" type="text"
onkeydown="if(event.key==='Enter')doSearch()"
onclick="this.focus()"
ontouchstart="this.focus()">
<button onclick="voiceSearch()">🎤</button>
<button onclick="doSearch()">🔍</button>
</div>

<button class="navbtn" onclick="show('wishlist')">
❤️ <span id="wishCount">0</span>
</button>

<button class="navbtn" onclick="show('cart')">
🛒 <span id="cartCount">0</span>
</button>

<button class="navbtn" onclick="show('orders')" id="ordersTop"></button>

<button class="navbtn" onclick="show('account')">
👤 <span id="accountTop"></span>
</button>

<button class="navbtn" onclick="languageModal()">🌐</button>

</div>
</header>

<main class="page" id="app"></main>

<div class="bottom">
<button onclick="show('home')">🏠 <span id="bottomHome"></span></button>
<button onclick="show('categories')">🗂️ <span id="bottomCategories"></span></button>
<button onclick="show('seller')">🏪 <span id="bottomSeller"></span></button>
<button onclick="show('orders')">📦 <span id="bottomOrders"></span></button>
<button onclick="show('account')">👤 <span id="bottomAccount"></span></button>
</div>

<div class="modal" id="modal">
<div class="modalbox" id="modalbox"></div>
</div>

function save(){
localStorage.setItem("zipWish",JSON.stringify(wishlist));
localStorage.setItem("zipCart",JSON.stringify(cart));
updateCounts();
}

function updateCounts(){
const w=document.getElementById("wishCount");
const c=document.getElementById("cartCount");
if(w)w.textContent=wishlist.length;
if(c)c.textContent=cart.reduce((a,x)=>a+x.qty,0);
}

function refreshHeader(){
if(!LANG_META[currentLang]) currentLang="Hindi";

document.documentElement.lang=LANG_META[currentLang].code;
document.documentElement.dir=currentLang==="Urdu"?"rtl":"ltr";

document.title="ZipCart — "+t("tagline");

const tagline=document.getElementById("tagline");
if(tagline) tagline.textContent=t("tagline");

const searchInput=document.getElementById("searchInput");
if(searchInput) searchInput.placeholder=t("search");

const ordersTop=document.getElementById("ordersTop");
if(ordersTop) ordersTop.textContent="📦 "+t("orders");

const accountTop=document.getElementById("accountTop");
if(accountTop) accountTop.textContent=t("account");

const bh=document.getElementById("bottomHome");
if(bh) bh.textContent=t("home");

const bc=document.getElementById("bottomCategories");
if(bc) bc.textContent=t("categories");

const bs=document.getElementById("bottomSeller");
if(bs) bs.textContent=t("seller");

const bo=document.getElementById("bottomOrders");
if(bo) bo.textContent=t("orders");

const ba=document.getElementById("bottomAccount");
if(ba) ba.textContent=t("account");

updateCounts();
}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(page,args={}){
currentPage=page;
currentArgs=args;
selectedCat=args.key||null;
renderPage();
window.scrollTo(0,0);
}

function renderPage(){
refreshHeader();

switch(currentPage){
case "home":home();break;
case "wishlist":wishlistPage();break;
case "cart":cartPage();break;
case "checkoutAddress":checkoutAddressPage();break;
case "checkoutPayment":checkoutPaymentPage();break;
case "orderSuccess":orderSuccessPage();break;
case "orders":orders();break;
case "account":account();break;
case "categories":categories();break;
case "seller":seller();break;
case "category":category(currentArgs.key);break;
case "subCategory":subCategory(currentArgs.key,currentArgs.sub);break;
case "product":product(currentArgs.id);break;
case "search":searchPage(currentArgs.q);break;
case "track":track();break;
case "return":returnFlow();break;
case "exchange":exchangeFlow();break;
}
}

function show(x){
navigate(x);
}

function productCard(p){
const liked=wishlist.includes(p.id);
const pct=Math.round((1-p.price/p.old)*100);

return `
<div class="card">
<button class="heart" onclick="toggleWish(${p.id})">${liked?"❤️":"♡"}</button>
<div class="photo" onclick="product(${p.id})">${p.emoji}</div>
<div class="cardbody">
<b onclick="product(${p.id})">${productName(p)}</b>
<div>
<span class="price">₹${p.price}</span>
<span class="old">₹${p.old}</span>
<span class="off">${pct}% OFF</span>
</div>
<div class="rating">⭐ ${p.rating}</div>
<div class="cardActions">
<button class="btn-add" onclick="promptAddToCart(${p.id})">🛒 ${t("addCart")}</button>
<button class="btn-buy" onclick="promptBuyNow(${p.id})">⚡ ${t("buyNow")}</button>
</div>
</div>
</div>
`;
}

/* =========================================================
   VOICE
========================================================= */

function voiceSearch(){
if(!("webkitSpeechRecognition" in window)){
alert("Voice search is not available in this browser.");
return;
}
let r=new webkitSpeechRecognition();
r.lang=LANG_META[currentLang].code;
r.onresult=e=>{
let q=e.results[0][0].transcript;
document.getElementById("searchInput").value=q;
searchPage(q);
};
r.start();
}

function speak(text){
if("speechSynthesis" in window){
let u=new SpeechSynthesisUtterance(text);
u.lang=LANG_META[currentLang].code;
speechSynthesis.cancel();
speechSynthesis.speak(u);
}
}

function languageModal(){
openModal(`
<h2>🌐 ${t("chooseLanguage")}</h2>
<p>${t("languageSaved")}</p>
<div class="quick">
${LANGUAGES.map(x=>`
<button class="pill ${x===currentLang?"lang-active":""}" onclick="setLang('${x}')">
${LANG_META[x].native}<br><small>${x}</small>
</button>
`).join("")}
</div>
<br>
<button class="back" onclick="closeModal()">${t("close")}</button>
`);
}

function setLang(x){
currentLang=x;
localStorage.setItem("zipLang",x);
closeModal();
refreshHeader();
renderPage();
}


/* =========================================================
   MODAL
========================================================= */

function openModal(x){
document.getElementById("modalbox").innerHTML=x;
document.getElementById("modal").classList.add("show");
}

function closeModal(){
document.getElementById("modal").classList.remove("show");
}
