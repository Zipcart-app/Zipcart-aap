<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZipCart — आपकी अपनी Shopping जगह ❤️</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans",sans-serif;background:#f7f7fb;color:#222}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#6a11cb,#8e2de2);color:#fff;padding:12px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:auto}
.logo{font-size:25px;font-weight:800;white-space:nowrap}
.tag{font-size:11px;opacity:.9}
.search{flex:1;min-width:220px;display:flex;background:#fff;border-radius:25px;overflow:hidden}
.search input{flex:1;border:0;padding:12px 15px;outline:0}
.search button{background:#fff;padding:0 10px}
.navbtn{background:#ffffff22;color:#fff;padding:10px 12px;border-radius:20px;font-weight:600}
.page{max-width:1200px;margin:auto;padding:14px}
.hero{background:linear-gradient(135deg,#fff0fa,#eee5ff);border-radius:20px;padding:24px;margin-bottom:16px}
.hero h1{margin:0 0 8px;color:#5c16b8}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.pill{background:#fff;border:1px solid #ddd;padding:9px 13px;border-radius:20px}
.section{margin:22px 0}
.section h2{margin:0 0 12px}
.hscroll{display:flex;gap:14px;overflow-x:auto;padding:5px 2px 12px}
.cat{min-width:92px;width:92px;text-align:center;flex:none}
.catpic{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #eadcff;box-shadow:0 3px 10px #0001;font-size:35px;margin:auto}
.cat b{display:block;font-size:13px;margin-top:7px}
.banner{background:linear-gradient(100deg,#5f0a87,#a4508b);color:#fff;border-radius:18px;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.banner button{background:#fff;color:#6812ad;padding:10px 15px;border-radius:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 10px #0001;position:relative}
.photo{height:155px;background:linear-gradient(135deg,#eee,#fafafa);display:flex;align-items:center;justify-content:center;font-size:70px}
.heart{position:absolute;right:8px;top:8px;background:#fff;border-radius:50%;width:36px;height:36px;font-size:20px;box-shadow:0 2px 7px #0002}
.cardbody{padding:11px}
.price{font-size:20px;font-weight:800}
.old{text-decoration:line-through;color:#888;font-size:13px;margin-left:5px}
.off{color:#16833c;font-weight:700;font-size:13px;margin-left:5px}
.rating{color:#087b36;font-weight:700;margin-top:5px}
.buy{width:100%;margin-top:9px;padding:10px;border-radius:10px;background:#6a11cb;color:#fff;font-weight:bold}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0001;margin-bottom:15px}
.back{background:#eee;padding:9px 14px;border-radius:18px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select,.field textarea{padding:11px;border:1px solid #ccc;border-radius:10px}
.field textarea{min-height:80px}
.modal{position:fixed;inset:0;background:#0008;z-index:100;display:none;align-items:center;justify-content:center;padding:15px}
.modalbox{background:#fff;border-radius:18px;max-width:700px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.modal.show{display:flex}
.track{display:flex;justify-content:space-between;gap:4px;position:relative;margin:20px 0}
.track:before{content:"";position:absolute;top:15px;left:6%;right:6%;height:4px;background:#ddd}
.step{z-index:1;text-align:center;font-size:11px;max-width:90px}
.dot{width:30px;height:30px;border-radius:50%;background:#eee;margin:auto;padding-top:7px}
.done .dot{background:#287be8;color:#fff}
.notice{background:#fff8df;border:1px solid #efd57c;border-radius:12px;padding:12px;margin:10px 0}
.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;justify-content:center;gap:8px;z-index:40}
.bottom button{background:#f2eff8;padding:9px 12px;border-radius:12px}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}.navbtn{padding:8px}.logo{font-size:21px}.photo{height:135px}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<header class="header">
<div class="top">
<div><div class="logo">🛍️ ZipCart</div><div class="tag">आपकी अपनी Shopping जगह ❤️</div></div>
<div class="search">
<input id="search" placeholder="क्या ढूँढ रहे हैं? जैसे Anarkali Suit" onkeydown="if(event.key==='Enter')doSearch()">
<button onclick="voiceSearch()">🎤</button><button onclick="doSearch()">🔍</button>
</div>
<button class="navbtn" onclick="show('wishlist')">❤️ <span id="wishCount">0</span></button>
<button class="navbtn" onclick="show('cart')">🛒 <span id="cartCount">0</span></button>
<button class="navbtn" onclick="show('orders')">📦 मेरे ऑर्डर</button>
<button class="navbtn" onclick="show('account')">👤 Account</button>
<button class="navbtn" onclick="languageModal()">🌐</button>
</div>
</header>

<main class="page" id="app"></main>

<div class="bottom">
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('categories')">🗂️ Categories</button>
<button onclick="show('seller')">🏪 Seller</button>
<button onclick="show('orders')">📦 My Orders</button>
<button onclick="show('account')">👤 Account</button>
</div>

<div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div>

<script>
const cats=[
["👗","महिलाओं का फैशन","women"],["👔","Men Fashion","men"],["🧒","Kids","kids"],
["👟","जूते","shoes"],["💍","ज्वेलरी","jewellery"],["👜","बैग","bags"],
["🧸","खिलौने","toys"],["💄","Beauty","beauty"],["🏠","घर का सामान","home"],
["📱","Electronics","electronics"],["📚","School Items","school"],["🚌","Travel Tickets","travel"],
["🧾","Bills & Recharge","bills"],["💊","Medicines","medicine"],["🛒","Grocery","grocery"]
];

const sub={
women:["👗 Saree","🥻 Suits","👚 Kurtis","👖 Jeans","👕 Tops","👗 Dresses","👰 Lehenga","🧥 Jackets","🌙 Nightwear","🪷 Ethnic Wear","👠 Western Wear"],
men:["👔 Shirts","👕 T-Shirts","👖 Jeans","🥻 Kurta","🧣 Kurta-Pajama","👖 Trousers/Pants","🧥 Jackets","🩳 Shorts","💼 Formal Wear","🏃 Sports Wear"],
kids:["👧 Girls","👦 Boys","👶 Baby","👗 Kids Dresses","👟 Kids Shoes","🍼 Baby Products","🧸 Toys"],
shoes:["👩 Women","👨 Men","🧒 Kids","🏃 Sports Shoes","🩴 Sandals","👠 Heels","🥿 Flats","🩴 Slippers"],
jewellery:["📿 Necklace","💎 Earrings","🪷 Bangles","💍 Rings","👰 Bridal Jewellery","✨ Artificial Jewellery"],
bags:["👜 Handbag","🎒 Sling Bag","🎒 School Bag","🧳 Travel Bag","🎒 Backpack","👛 Wallet/Purse"],
toys:["🧸 Baby Toys","🧠 Educational","🚗 Cars","👧 Dolls","🎲 Games","🎮 Remote Toys","⚽ Outdoor Toys"],
beauty:["💄 Makeup","🧴 Skincare","💇 Haircare","🧼 Personal Care"],
home:["🍳 Kitchen","🖼️ Home Decor","🛋️ Furniture","📦 Storage","🛏️ Bedsheet","🪟 Curtains"],
electronics:["📱 Mobile Accessories","🎧 Earphones","🔌 Chargers","🔗 Cables","🔊 Speakers","💻 Other Electronics"],
school:["🎒 School Bags","📖 Books","📓 Notebooks","✏️ Stationery","🎨 Art & Craft"],
travel:["🚌 Bus","🚆 Train","✈️ Flight","🏨 Hotel"],
bills:["📱 Mobile Recharge","📺 DTH","⚡ Electricity","💧 Water","🔥 Gas","🌐 Broadband/Landline","🛣️ FASTag","🛡️ Insurance","🎓 Education Fees","🏠 Property/Other Bills"],
medicine:["💊 Common Care","🩺 Prescription Medicines","🧴 Health & Personal Care","🌡️ Devices & Wellness"],
grocery:["🥦 Fresh Grocery","🍚 Staples","🥛 Dairy","🍪 Snacks","🧹 Household","🧼 Cleaning","🧃 Beverages"]
};

const lehenga=["👰 Bridal","🎉 Party Wear","✨ Net","💎 Designer","🌟 Heavy Work","🥻 Silk","🌸 Georgette","✨ Sequins","🧵 Embroidery","🌺 Floral","🌿 Simple/Lightweight","👧 Girls/Kids"];
const saree=["👑 Banarasi","🥻 Silk","🌿 Cotton","🌸 Georgette","🪶 Chiffon","🌺 Bandhej","🎉 Party Wear","👰 Bridal","✨ Designer","🧵 Embroidery","🖼️ Printed","🌿 Linen"];

const products=[
{id:1,name:"Beautiful Saree",cat:"women",sub:"Saree",emoji:"🥻",price:999,old:1499,rating:4.5},
{id:2,name:"Designer Anarkali Suit",cat:"women",sub:"Suits",emoji:"👗",price:122,old:610,rating:4.5},
{id:3,name:"Stylish Shoes",cat:"shoes",sub:"Women",emoji:"👠",price:799,old:1299,rating:4.3},
{id:4,name:"Kids Toy Car",cat:"toys",sub:"Cars",emoji:"🚗",price:499,old:799,rating:4.4},
{id:5,name:"Fashion Jewellery Set",cat:"jewellery",sub:"Artificial Jewellery",emoji:"💍",price:399,old:699,rating:4.2},
{id:6,name:"Women Handbag",cat:"bags",sub:"Handbag",emoji:"👜",price:799,old:1199,rating:4.4},
{id:7,name:"Cotton Kurti",cat:"women",sub:"Kurtis",emoji:"👚",price:549,old:899,rating:4.6},
{id:8,name:"Men Casual Shirt",cat:"men",sub:"Shirts",emoji:"👔",price:699,old:999,rating:4.3},
{id:9,name:"Kids Dress",cat:"kids",sub:"Kids Dresses",emoji:"👗",price:449,old:799,rating:4.5},
{id:10,name:"Wireless Earphones",cat:"electronics",sub:"Earphones",emoji:"🎧",price:899,old:1499,rating:4.1},
{id:11,name:"Grocery Daily Essentials",cat:"grocery",sub:"Household",emoji:"🛒",price:299,old:349,rating:4.4},
{id:12,name:"Health Care Product",cat:"medicine",sub:"Common Care",emoji:"💊",price:199,old:249,rating:4.2}
];

let wishlist=JSON.parse(localStorage.getItem("zipWish")||"[]");
let cart=JSON.parse(localStorage.getItem("zipCart")||"[]");
let currentLang=localStorage.getItem("zipLang")||"Hindi";
let selectedCat=null;

function save(){
localStorage.setItem("zipWish",JSON.stringify(wishlist));
localStorage.setItem("zipCart",JSON.stringify(cart));
updateCounts();
}
function updateCounts(){
document.getElementById("wishCount").textContent=wishlist.length;
document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);
}
function productCard(p){
const liked=wishlist.includes(p.id),pct=Math.round((1-p.price/p.old)*100);
return `<div class="card">
<button class="heart" onclick="toggleWish(${p.id})">${liked?"❤️":"♡"}</button>
<div class="photo">${p.emoji}</div>
<div class="cardbody"><b>${p.name}</b>
<div><span class="price">₹${p.price}</span><span class="old">₹${p.old}</span><span class="off">${pct}% OFF</span></div>
<div class="rating">⭐ ${p.rating}</div>
<button class="buy" onclick="product(${p.id})">देखें / खरीदें</button>
</div></div>`;
}
function home(){
app.innerHTML=`
<div class="panel">
<h2>🏠 ZipCart Home</h2>
<p>आपकी अपनी Shopping जगह ❤️</p>
</div>

<div class="grid">
${products.slice(0,8).map(productCard).join("")}
</div>
`;
}

function account(){
app.innerHTML=`<h2>👤 मेरी ZipCart</h2><div class="grid">${["📦 Orders","❤️ Wishlist","🛒 Cart","🏠 Addresses","💳 Payments","🎟️ Coupons","⭐ Reviews","↩️ Returns & Refunds","🔔 Notifications","🆘 Help & Support","🌐 Language","⚙️ Accessibility","🔐 Login/OTP","🚪 Logout"].map(x=>`<button class="panel" onclick="alert('${x}: यह feature production backend में जुड़ेगा।')">${x}</button>`).join("")}</div>`;
}
function categories(){app.innerHTML=`<h2>🗂️ सभी Categories</h2>${catsHTML()}`}
function seller(){
app.innerHTML=`<div class="panel"><h2>🏪 ZipCart Seller Registration</h2>
<div class="notice">एक ही registration form. पहले चुनें कि आप क्या बेचना चाहते हैं। भाषा बदलने पर भरी हुई जानकारी मिटेगी नहीं।</div>
<div class="field"><label>🌐 Form Language</label><select><option>Hindi</option><option>English</option><option>Gujarati</option><option>Marathi</option><option>Bengali</option><option>Tamil</option><option>Telugu</option><option>Kannada</option><option>Malayalam</option><option>Punjabi</option><option>Odia</option><option>Assamese</option><option>Urdu</option><option>Nepali</option><option>Maithili</option><option>Konkani</option></select></div><br>
<div class="field"><label>आप ZipCart पर क्या बेचना चाहते हैं?</label><select><option>Clothing</option><option>Artificial Jewellery</option><option>Shoes</option><option>Bags</option><option>Toys</option><option>Kids Products</option><option>Beauty</option><option>Home & Kitchen</option><option>Electronics</option><option>School Items</option><option>Grocery</option><option>Medicines</option><option>Travel</option><option>Other</option></select></div>
<div class="formgrid" style="margin-top:12px"><div class="field"><label>Seller/Business Name</label><input></div><div class="field"><label>Mobile / Email</label><input></div>
<div class="field"><label>PAN / applicable identity details</label><input></div><div class="field"><label>GSTIN, जहाँ लागू/आवश्यक हो</label><input></div>
<div class="field"><label>Business Address</label><textarea></textarea></div><div class="field"><label>Required licence/documents</label><input placeholder="Category के अनुसार"></div></div>
<p>💊 Medicines के लिए लागू drug/pharmacy licence, prescription verification और अन्य कानूनी requirements पूरी होने के बाद ही listing/sale की अनुमति होगी।</p>
<button class="pill" onclick="speak('आप ZipCart पर क्या बेचना चाहते हैं? कृपया अपनी category चुनें।')">🔊 सुनें</button>
<button class="buy" onclick="alert('Prototype registration saved. Real OTP/document verification के लिए secure backend जरूरी है।')">Continue</button></div>
<div class="panel"><h3>📋 Seller Dashboard Preview</h3><p>Products • Orders • Stock • Variants • Returns • Reviews • Earnings • Payouts • Verification • Help • Vacation Mode</p></div>`;
}
function searchPage(q){
let ps=products.filter(p=>
(p.name+" "+p.sub).toLowerCase().includes(q.toLowerCase())
);

let activePrice="all";
let activeRating=0;
let activeSort="default";

function renderResults(){
let result=[...ps];

if(activePrice!=="all"){
result=result.filter(p=>{
if(activePrice==="0-500") return p.price<=500;
if(activePrice==="500-1000") return p.price>500&&p.price<=1000;
if(activePrice==="1000-1500") return p.price>1000&&p.price<=1500;
if(activePrice==="1500-2000") return p.price>1500&&p.price<=2000;
if(activePrice==="2000-3000") return p.price>2000&&p.price<=3000;
if(activePrice==="3000-5000") return p.price>3000&&p.price<=5000;
if(activePrice==="5000-10000") return p.price>5000&&p.price<=10000;
if(activePrice==="10000+") return p.price>10000;
return true;
});
}

if(activeRating>0){
result=result.filter(p=>p.rating>=activeRating);
}

if(activeSort==="low") result.sort((a,b)=>a.price-b.price);
if(activeSort==="high") result.sort((a,b)=>b.price-a.price);
if(activeSort==="rating") result.sort((a,b)=>b.rating-a.rating);

app.innerHTML=`
<button class="back" onclick="show('home')">← Home</button>
<div class="panel">
<h2>🔎 Search: “${q}”</h2>
<p id="resultCount">${result.length} विकल्प मिले</p>

<h3>💰 Price</h3>
<div class="quick">
<button class="pill" onclick="priceFilter('all')">All</button>
<button class="pill" onclick="priceFilter('0-500')">₹100–₹500</button>
<button class="pill" onclick="priceFilter('500-1000')">₹500–₹1,000</button>
<button class="pill" onclick="priceFilter('1000-1500')">₹1,000–₹1,500</button>
<button class="pill" onclick="priceFilter('1500-2000')">₹1,500–₹2,000</button>
<button class="pill" onclick="priceFilter('2000-3000')">₹2,000–₹3,000</button>
<button class="pill" onclick="priceFilter('3000-5000')">₹3,000–₹5,000</button>
<button class="pill" onclick="priceFilter('5000-10000')">₹5,000–₹10,000</button>
<button class="pill" onclick="priceFilter('10000+')">₹10,000+</button>
</div>

<h3>⭐ Rating</h3>
<div class="quick">
<button class="pill" onclick="ratingFilter(0)">All</button>
<button class="pill" onclick="ratingFilter(4)">⭐ 4+</button>
<button class="pill" onclick="ratingFilter(4.5)">⭐ 4.5+</button>
</div>

<h3>↕️ Sort By</h3>
<div class="quick">
<button class="pill" onclick="sortProducts('low')">Price Low-High</button>
<button class="pill" onclick="sortProducts('high')">Price High-Low</button>
<button class="pill" onclick="sortProducts('rating')">Highest Rating</button>
<button class="pill" onclick="sortProducts('default')">Popular</button>
</div>
</div>

<div id="searchResults" class="grid"></div>
<div class="notice">🔔 Price Drop / Back in Stock alerts बाद में जोड़े जा सकते हैं।</div>
`;

window.priceFilter=function(value){
activePrice=value;
renderResults();
};

window.ratingFilter=function(value){
activeRating=value;
renderResults();
};

window.sortProducts=function(value){
activeSort=value;
renderResults();
};

renderResults();
}
function doSearch(){let q=document.getElementById("search").value.trim();if(q)searchPage(q)}
function doSearchText(q){document.getElementById("search").value=q;searchPage(q)}
function voiceSearch(){
if(!("webkitSpeechRecognition" in window)){alert("इस browser में voice search उपलब्ध नहीं है।");return}
let r=new webkitSpeechRecognition();r.lang="hi-IN";
r.onresult=e=>{let q=e.results[0][0].transcript;document.getElementById("search").value=q;searchPage(q)};r.start();
}
function speak(t){if("speechSynthesis" in window)speechSynthesis.speak(new SpeechSynthesisUtterance(t))}
function speakList(a){a.forEach((x,i)=>setTimeout(()=>speak(x.substring(x.indexOf(" ")+1)),i*900))}
function languageModal(){
openModal(`<h2>🌐 भाषा चुनें</h2><p>आपकी पसंद याद रखी जाएगी।</p><div class="quick">
${["Hindi","English","Gujarati","Marathi","Bengali","Tamil","Telugu","Kannada","Malayalam","Punjabi","Odia","Assamese","Urdu","Nepali","Maithili","Konkani"].map(x=>`<button class="pill" onclick="setLang('${x}')">${x}</button>`).join("")}</div><br><button class="back" onclick="closeModal()">बंद करें</button>`);
}
function setLang(x){currentLang=x;localStorage.setItem("zipLang",x);closeModal();alert("Language saved: "+x+" (full translation content layer में जोड़ी जाएगी।)")}
function openModal(x){document.getElementById("modalbox").innerHTML=x;document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function show(x){
selectedCat=null;
if(x==="home")home();
if(x==="wishlist")wishlistPage();
if(x==="cart")cartPage();
if(x==="orders")orders();
if(x==="account")account();
if(x==="categories")categories();
if(x==="seller")seller();
window.scrollTo(0,0);
}
show("home");
</script>
</body>
</html>
