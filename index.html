<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZipCart — आपकी अपनी Shopping जगह ❤️</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Arial,"Noto Sans",sans-serif;
  background:#faf7ff;
  color:#222;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:linear-gradient(135deg,#4b0082,#6a11cb,#e91e63);
  color:#fff;
  box-shadow:0 3px 15px #0002;
}
.top{
  display:flex;
  align-items:center;
  gap:14px;
  padding:12px 16px;
  flex-wrap:wrap;
}
.logo{
  font-size:25px;
  font-weight:800;
  white-space:nowrap;
}
.tag{
  font-size:12px;
  opacity:.9;
}
.search{
  flex:1;
  min-width:230px;
  display:flex;
  gap:5px;
}
.search input{
  width:100%;
  border:0;
  outline:0;
  border-radius:25px;
  padding:12px 15px;
}
.iconBtn,.headBtn{
  border:0;
  border-radius:22px;
  background:#ffffff22;
  color:#fff;
  padding:10px 13px;
  white-space:nowrap;
}
.iconBtn:hover,.headBtn:hover{background:#ffffff38}
.count{
  background:#fff;
  color:#6a11cb;
  border-radius:50%;
  min-width:21px;
  height:21px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:800;
}
.nav{
  display:flex;
  gap:8px;
  padding:7px 12px 10px;
  overflow-x:auto;
}
.nav button{
  border:0;
  background:#ffffff18;
  color:#fff;
  border-radius:18px;
  padding:8px 13px;
  white-space:nowrap;
}
.nav button:hover{background:#ffffff35}

.categoryBar{
  display:flex;
  gap:10px;
  padding:12px;
  overflow-x:auto;
  background:#fff;
  border-bottom:1px solid #eee;
}
.catChip{
  border:1px solid #ddd;
  background:#fff;
  border-radius:30px;
  padding:8px 14px;
  white-space:nowrap;
}
.catChip:hover{
  border-color:#7c3aed;
  color:#5b21b6;
}

main{max-width:1250px;margin:auto;padding:18px}
.hero{
  background:linear-gradient(135deg,#5b21b6,#7c3aed,#ec4899);
  color:#fff;
  border-radius:24px;
  padding:30px 24px;
  margin-bottom:20px;
}
.hero h1{margin:0 0 8px;font-size:30px}
.hero p{margin:0;opacity:.95}

.sectionTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:22px 0 13px;
  flex-wrap:wrap;
}
.sectionTitle h2{margin:0;color:#4b0082}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
}
.catCard{
  border:0;
  background:#fff;
  border-radius:20px;
  padding:18px 10px;
  box-shadow:0 4px 16px #4b008214;
  text-align:center;
  min-height:130px;
}
.catCard .emoji{font-size:40px}
.catCard strong{
  display:block;
  margin-top:7px;
  font-size:15px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
  gap:16px;
}
.card{
  position:relative;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 4px 15px #4b008214;
}
.productImage{
  height:170px;
  background:linear-gradient(135deg,#f3e8ff,#fce7f3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:75px;
}
.cardBody{padding:13px}
.card h3{margin:0 0 7px;font-size:17px}
.price{font-size:20px;font-weight:800;color:#5b21b6}
.oldPrice{
  text-decoration:line-through;
  color:#999;
  font-size:13px;
}
.heart{
  position:absolute;
  right:9px;
  top:9px;
  width:36px;
  height:36px;
  border-radius:50%;
  border:0;
  background:#fff;
  box-shadow:0 2px 8px #0002;
  font-size:20px;
}
.actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:10px;
}
.primary,.secondary,.danger{
  border:0;
  border-radius:12px;
  padding:10px 13px;
  font-weight:700;
}
.primary{
  background:linear-gradient(135deg,#5b21b6,#ec4899);
  color:#fff;
}
.secondary{
  background:#f0e9ff;
  color:#5b21b6;
}
.danger{
  background:#ffe4e6;
  color:#be123c;
}

.panel{
  background:#fff;
  border-radius:20px;
  padding:20px;
  box-shadow:0 4px 16px #4b008214;
  margin-bottom:18px;
}
.back{
  border:0;
  background:#f0e9ff;
  color:#5b21b6;
  padding:9px 14px;
  border-radius:20px;
  margin-bottom:15px;
}

.subGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:12px;
}
.subCard{
  border:1px solid #eadcff;
  background:#fff;
  border-radius:17px;
  padding:16px 10px;
  text-align:center;
}
.subCard .emoji{font-size:35px;display:block;margin-bottom:7px}

.filterBar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:12px 0 18px;
}
.filterBar select,.filterBar input{
  border:1px solid #ddd;
  border-radius:12px;
  padding:10px;
  background:#fff;
}

.detail{
  display:grid;
  grid-template-columns:minmax(250px,1fr) minmax(250px,1fr);
  gap:25px;
}
.detailImage{
  min-height:330px;
  border-radius:25px;
  background:linear-gradient(135deg,#f3e8ff,#fce7f3);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:140px;
}
.optionRow{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:10px 0 16px;
}
.option{
  border:1px solid #ddd;
  background:#fff;
  padding:8px 12px;
  border-radius:10px;
}
.option.active{
  background:#5b21b6;
  color:#fff;
  border-color:#5b21b6;
}

.cartItem{
  display:grid;
  grid-template-columns:75px 1fr auto;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #eee;
  padding:14px 0;
}
.cartImg{
  width:75px;
  height:75px;
  border-radius:15px;
  background:#f3e8ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:35px;
}
.qty{
  display:flex;
  align-items:center;
  gap:7px;
}
.qty button{
  width:30px;
  height:30px;
  border:0;
  border-radius:8px;
  background:#eee5ff;
}

.totalBox{
  background:#f7f1ff;
  border-radius:18px;
  padding:16px;
  margin-top:15px;
}
.totalLine{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}
.totalLine.final{
  font-size:21px;
  font-weight:800;
  border-top:1px solid #ddd;
  padding-top:12px;
}

.formGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:5px;
}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{
  padding:11px;
  border:1px solid #ddd;
  border-radius:11px;
  outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:#7c3aed;
}

.payment{
  display:grid;
  gap:10px;
}
.payOption{
  border:1px solid #ddd;
  border-radius:14px;
  padding:14px;
  display:flex;
  gap:10px;
  align-items:center;
}
.payOption.active{
  border-color:#7c3aed;
  background:#f7f1ff;
}

.timeline{
  position:relative;
  padding-left:35px;
}
.timeline:before{
  content:"";
  position:absolute;
  left:12px;
  top:0;
  bottom:0;
  width:3px;
  background:#ddd;
}
.step{
  position:relative;
  margin:0 0 22px;
}
.step:before{
  content:"";
  position:absolute;
  left:-29px;
  top:2px;
  width:16px;
  height:16px;
  border-radius:50%;
  background:#ddd;
  border:3px solid #fff;
  box-shadow:0 0 0 1px #ccc;
}
.step.done:before{background:#7c3aed}
.step strong{display:block}

.accountGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
}
.accountCard{
  border:0;
  background:#fff;
  box-shadow:0 3px 12px #4b008214;
  border-radius:17px;
  padding:18px;
  text-align:left;
}
.accountCard .big{font-size:30px}

.voiceBtn{
  border:0;
  background:#5b21b6;
  color:#fff;
  border-radius:50%;
  width:45px;
  height:45px;
  font-size:20px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%);
  background:#24104f;
  color:#fff;
  padding:12px 18px;
  border-radius:25px;
  z-index:3000;
  display:none;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:2500;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modalBox{
  background:#fff;
  width:min(600px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:22px;
  padding:20px;
}
.langList{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.langItem{
  border:1px solid #ddd;
  background:#fff;
  border-radius:12px;
  padding:12px;
  text-align:left;
}
.langItem.active{
  border-color:#7c3aed;
  background:#f3e8ff;
  color:#5b21b6;
  font-weight:700;
}

.empty{
  text-align:center;
  padding:45px 15px;
  color:#777;
}
.empty .big{font-size:55px}

.bottom{
  display:none;
}

@media(max-width:750px){
  .top{padding:10px}
  .logo{font-size:21px}
  .search{order:3;flex-basis:100%}
  .detail{grid-template-columns:1fr}
  .detailImage{min-height:250px;font-size:110px}
  .formGrid{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .productImage{height:130px;font-size:58px}
  .cardBody{padding:10px}
  .card h3{font-size:14px}
  .price{font-size:17px}
  .bottom{
    position:sticky;
    bottom:0;
    z-index:900;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    background:#fff;
    box-shadow:0 -2px 12px #0002;
  }
  .bottom button{
    border:0;
    background:#fff;
    padding:8px 2px;
    font-size:11px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="top">
    <div>
      <div class="logo">🛍️ ZipCart</div>
      <div class="tag" id="tagline"></div>
    </div>

    <div class="search">
      <input id="searchInput" type="text">
      <button class="iconBtn" onclick="voiceSearch()">🎙️</button>
      <button class="iconBtn" onclick="doSearch()">🔍</button>
    </div>

    <button class="headBtn" onclick="show('wishlist')">
      ❤️ <span id="wishCount" class="count">0</span>
    </button>

    <button class="headBtn" onclick="show('cart')">
      🛒 <span id="cartCount" class="count">0</span>
    </button>

    <button class="headBtn" onclick="openLanguage()">🌐 <span id="langText"></span></button>
  </div>

  <div class="nav">
    <button onclick="show('home')" id="navHome"></button>
    <button onclick="show('categories')" id="navCategories"></button>
    <button onclick="show('orders')" id="navOrders"></button>
    <button onclick="show('account')" id="navAccount"></button>
    <button onclick="show('seller')" id="navSeller"></button>
  </div>
</header>

<div class="categoryBar" id="categoryBar"></div>

<main id="app"></main>

<div class="bottom">
  <button onclick="show('home')">🏠<br><span id="bHome"></span></button>
  <button onclick="show('categories')">📂<br><span id="bCategories"></span></button>
  <button onclick="show('cart')">🛒<br><span id="bCart"></span></button>
  <button onclick="show('orders')">📦<br><span id="bOrders"></span></button>
  <button onclick="show('account')">👤<br><span id="bAccount"></span></button>
</div>

<div id="toast" class="toast"></div>

<div id="languageModal" class="modal" onclick="closeLanguage(event)">
  <div class="modalBox" onclick="event.stopPropagation()">
    <div class="sectionTitle">
      <h2 id="languageTitle"></h2>
      <button class="secondary" onclick="closeLanguage()">✕</button>
    </div>
    <p id="languageHint"></p>
    <div id="languageList" class="langList"></div>
  </div>
</div>

function t(key){
  return (T[currentLang]&&T[currentLang][key]) || T.English[key] || key;
}
function catName(key){
  return (CAT_NAMES[currentLang]&&CAT_NAMES[currentLang][key]) || CAT_NAMES.English[key] || key;
}
function subName(key){
  return (SUB_NAMES[currentLang]&&SUB_NAMES[currentLang][key]) || SUB_NAMES.English[key] || key;
}
function productName(id){
  return (PRODUCT_NAMES[id]&&PRODUCT_NAMES[id][currentLang]) || PRODUCT_NAMES[id]?.English || products[id]?.name || "";
}
function colorName(c){
  const map={red:"red",blue:"blue",black:"black",white:"white",pink:"pink",gold:"gold",silver:"silver",green:"green"};
  if(c==="gold") return currentLang==="Hindi"?"गोल्ड":c;
  if(c==="silver") return currentLang==="Hindi"?"सिल्वर":c;
  if(c==="green") return currentLang==="Hindi"?"हरा":c;
  return t(map[c]||c);
}

function getCart(){
  return JSON.parse(localStorage.getItem("zc_cart")||"[]");
}
function saveCart(cart){
  localStorage.setItem("zc_cart",JSON.stringify(cart));
  refreshHeader();
}
function getWishlist(){
  return JSON.parse(localStorage.getItem("zc_wishlist")||"[]");
}
function saveWishlist(w){
  localStorage.setItem("zc_wishlist",JSON.stringify(w));
  refreshHeader();
}

function money(n){
  return "₹"+Number(n).toLocaleString("en-IN");
}

function showToast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg;
  el.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>el.style.display="none",2200);
}

function refreshHeader(){
  const lang=LANGUAGES.find(x=>x.key===currentLang)||LANGUAGES[0];
  document.documentElement.lang=lang.code;
  document.documentElement.dir=currentLang==="Urdu"?"rtl":"ltr";

  document.title=currentLang==="Hindi"
    ?"ZipCart — आपकी अपनी Shopping जगह ❤️"
    :`ZipCart — ${t("tagline")}`;

  document.getElementById("tagline").textContent=t("tagline");
  document.getElementById("langText").textContent=lang.native;

  document.getElementById("navHome").textContent=t("home");
  document.getElementById("navCategories").textContent=t("categories");
  document.getElementById("navOrders").textContent=t("orders");
  document.getElementById("navAccount").textContent=t("account");
  document.getElementById("navSeller").textContent=t("seller");

  document.getElementById("bHome").textContent=t("home");
  document.getElementById("bCategories").textContent=t("categories");
  document.getElementById("bCart").textContent=t("cart");
  document.getElementById("bOrders").textContent=t("orders");
  document.getElementById("bAccount").textContent=t("account");

  const si=document.getElementById("searchInput");
  si.placeholder=t("searchPlaceholder");

  document.getElementById("wishCount").textContent=getWishlist().length;
  document.getElementById("cartCount").textContent=getCart().reduce((s,x)=>s+(x.qty||1),0);

  document.getElementById("categoryBar").innerHTML=CATEGORIES.map(c=>
    `<button class="catChip" onclick="category('${c.key}')">${c.emoji} ${catName(c.key)}</button>`
  ).join("");
}

function navigate(page,args={}){
  currentPage=page;
  currentArgs=args;
  renderPage();
  window.scrollTo({top:0,behavior:"smooth"});
}

function show(page){
  navigate(page);
}

function renderPage(){
  refreshHeader();

  switch(currentPage){
    case"home":home();break;
    case"wishlist":wishlistPage();break;
    case"cart":cartPage();break;
    case"orders":orders();break;
    case"account":account();break;
    case"categories":categories();break;
    case"seller":seller();break;
    case"category":categoryPage(currentArgs.key);break;
    case"subCategory":subCategoryPage(currentArgs.cat,currentArgs.sub);break;
    case"product":productPage(currentArgs.id);break;
    case"checkout":checkoutPage();break;
    case"search":searchPage(currentArgs.query);break;
    case"track":trackPage(currentArgs.id);break;
    case"return":returnPage(currentArgs.id);break;
    case"exchange":exchangePage(currentArgs.id);break;
    default:home();
  }
}

function productCard(p){
  const wish=getWishlist().includes(p.id);
  return `
    <div class="card">
      <button class="heart" onclick="toggleWish(${p.id});event.stopPropagation()">
        ${wish?"❤️":"♡"}
      </button>

      <div class="productImage" onclick="productPage(${p.id})">${p.emoji}</div>

      <div class="cardBody">
        <h3>${productName(p.id)}</h3>
        <div class="price">${money(p.price)}</div>

        <div class="actions">
          <button class="secondary" onclick="productPage(${p.id})">${t("viewAll")}</button>
          <button class="primary" onclick="addCart(${p.id})">${t("addCart")}</button>
        </div>
      </div>
    </div>
  `;
}

function subCategoryPage(cat,sub){
  navigate("subCategory",{cat,sub});
}

function subCategoryPageRender(cat,sub){
  const list=products.filter(p=>p.cat===cat&&p.sub===sub);

  getApp().innerHTML=`
    <button class="back" onclick="categoryPage('${cat}')">← ${t("back")}</button>

    <div class="sectionTitle">
      <h2>${subName(sub)}</h2>
      <button class="voiceBtn" onclick="speakText('${subName(sub)}')">🔊</button>
    </div>

    <div class="filterBar">
      <select onchange="applySubFilter('${cat}','${sub}',this.value)">
        <option value="">${t("filter")}</option>
        <option value="100-500">${t("price100500")}</option>
        <option value="500-1000">${t("price5001000")}</option>
        <option value="1000-1500">${t("price10001500")}</option>
      </select>

      <select onchange="sortSubProducts('${cat}','${sub}',this.value)">
        <option value="">${t("sort")}</option>
        <option value="low">${t("lowHigh")}</option>
        <option value="high">${t("highLow")}</option>
      </select>
    </div>

    <div id="subProducts" class="products">
      ${list.map(productCard).join("") || `
        <div class="panel empty">
          <div class="big">🔎</div>
          <p>${t("noResults")}</p>
        </div>
      `}
    </div>
  `;
}

function applySubFilter(cat,sub,value){
  let list=products.filter(p=>p.cat===cat&&p.sub===sub);
  if(value){
    const [a,b]=value.split("-").map(Number);
    list=list.filter(p=>p.price>=a&&p.price<=b);
  }
  document.getElementById("subProducts").innerHTML=
    list.map(productCard).join("")||`<div class="panel empty"><p>${t("noResults")}</p></div>`;
}

function sortSubProducts(cat,sub,value){
  let list=products.filter(p=>p.cat===cat&&p.sub===sub);
  if(value==="low")list.sort((a,b)=>a.price-b.price);
  if(value==="high")list.sort((a,b)=>b.price-a.price);
  document.getElementById("subProducts").innerHTML=
    list.map(productCard).join("")||`<div class="panel empty"><p>${t("noResults")}</p></div>`;
}

/* ---------------- CART ---------------- */

function addCart(id){
  const cart=getCart();
  const found=cart.find(x=>x.id===id);
  if(found)found.qty=(found.qty||1)+1;
  else cart.push({id,qty:1});
  saveCart(cart);
  showToast(t("productAdded"));
}

function buyNow(id){
  const cart=getCart();
  const found=cart.find(x=>x.id===id);
  if(!found)cart.push({id,qty:1});
  saveCart(cart);
  navigate("checkout");
}

function changeQty(id,delta){
  const cart=getCart();
  const item=cart.find(x=>x.id===id);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)cart.splice(cart.indexOf(item),1);
  saveCart(cart);
  renderPage();
}

function removeCart(id){
  saveCart(getCart().filter(x=>x.id!==id));
  renderPage();
}

function searchPageRender(q=""){
  const term=(q||"").toLowerCase();

  const list=products.filter(p=>{
    const names=[
      p.name,
      productName(p.id),
      subName(p.sub),
      catName(p.cat)

  });

  getApp().innerHTML=`
    <div class="sectionTitle">
      <h2>🔎 ${t("searchResults")}</h2>
    </div>

    <div class="filterBar">
      <select onchange="searchFilter(this.value,'${encodeURIComponent(q||"")}')">
        <option value="">${t("filter")}</option>
        <option value="100-500">${t("price100500")}</option>
        <option value="500-1000">${t("price5001000")}</option>
        <option value="1000-1500">${t("price10001500")}</option>
      </select>

      <select onchange="searchSort(this.value,'${encodeURIComponent(q||"")}')">
        <option value="">${t("sort")}</option>
        <option value="low">${t("lowHigh")}</option>
        <option value="high">${t("highLow")}</option>

      ${list.map(productCard).join("")||`

          <div class="big">🔎</div>
          <p>${t("noResults")}</p>
        </div>
      `}
    </div>
  `;
}

function searchFilter(value,encoded){
  const q=decodeURIComponent(encoded);
  let list=products.filter(p=>{
    const names=[p.name,productName(p.id),subName(p.sub),catName(p.cat)].join(" ").toLowerCase();
    return !q||names.includes(q.toLowerCase());
  });

  if(value){
    const [a,b]=value.split("-").map(Number);
    list=list.filter(p=>p.price>=a&&p.price<=b);
  }

  document.getElementById("searchProducts").innerHTML=
    list.map(productCard).join("")||`<div class="panel empty"><p>${t("noResults")}</p></div>`;
}

function searchSort(value,encoded){
  const q=decodeURIComponent(encoded);
  let list=products.filter(p=>{
    const names=[p.name,productName(p.id),subName(p.sub),catName(p.cat)].join(" ").toLowerCase();
    return !q||names.includes(q.toLowerCase());
  });

  if(value==="low")list.sort((a,b)=>a.price-b.price);
  if(value==="high")list.sort((a,b)=>b.price-a.price);

  document.getElementById("searchProducts").innerHTML=
    list.map(productCard).join("")||`<div class="panel empty"><p>${t("noResults")}</p></div>`;
}

function updatePaymentTotal(){
  const pay=document.querySelector('input[name="pay"]:checked')?.value;
  const card=document.getElementById("cardFields");
  const extra=pay==="cod"?50:0;

  if(card)card.style.display=pay==="card"?"block":"none";
  const codEl=document.getElementById("checkoutCod");
  const totalEl=document.getElementById("checkoutTotal");

  if(codEl)codEl.textContent=money(extra);
  if(totalEl)totalEl.textContent=money((window.__checkoutSubtotal||0)+extra);
}

function placeOrder(){
  const cart=getCart();
  if(!cart.length)return;

  const orders=JSON.parse(localStorage.getItem("zc_orders")||"[]");

  orders.unshift({
    id:"ZC"+Date.now(),
    items:cart,
    date:new Date().toLocaleDateString("en-IN"),
    status:"placed"
  });

  localStorage.setItem("zc_orders",JSON.stringify(orders));
  localStorage.removeItem("zc_cart");
  refreshHeader();

  showToast(t("orderPlaced"));
  setTimeout(()=>show("orders"),700);
}

/* ---------------- LANGUAGE ---------------- */

function openLanguage(){
  const modal=document.getElementById("languageModal");
  document.getElementById("languageTitle").textContent=t("chooseLanguage");
  document.getElementById("languageHint").textContent=t("languageHint");

  document.getElementById("languageList").innerHTML=LANGUAGES.map(l=>`
    <button class="langItem ${l.key===currentLang?"active":""}" onclick="setLang('${l.key}')">
      ${l.native} — ${l.key}
    </button>
  `).join("");

  modal.style.display="flex";
}

function closeLanguage(e){
  if(e && e.target!==document.getElementById("languageModal"))return;
  document.getElementById("languageModal").style.display="none";
}

function setLang(lang){
  if(!LANGUAGES.some(x=>x.key===lang))return;

  currentLang=lang;
  localStorage.setItem("zc_lang",lang);

  document.getElementById("languageModal").style.display="none";

  refreshHeader();
  renderPage();
}

/* ---------------- VOICE ---------------- */

function speakText(text){
  if(!("speechSynthesis" in window)){
    showToast(t("voiceUnavailable"));
    return;
  }

  speechSynthesis.cancel();

  const lang=LANGUAGES.find(x=>x.key===currentLang);
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang?.code||"hi-IN";
  speechSynthesis.speak(u);
}

function speakSubList(cat){
  const names=(SUBS[cat]||[]).map(x=>subName(x[0])).join(", ");
  speakText(names);
}

function voiceSearch(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

  if(!SR){
    showToast(t("voiceUnavailable"));
    return;
  }

  const recognition=new SR();
  const lang=LANGUAGES.find(x=>x.key===currentLang);
  recognition.lang=lang?.code||"hi-IN";

  recognition.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById("searchInput").value=text;
    searchPage(text);
  };

  recognition.start();
}

  window.checkoutPage=checkoutPage;
  window.trackPageRender=trackPageRender;
  window.returnPageRender=returnPageRender;
  window.exchangePageRender=exchangePageRender;

  renderPage();
}

/* wrappers used by renderPage */
function categoryPage(key){
  selectedCat=key;
  const items=SUBS[key]||[];

  getApp().innerHTML=`
    <button class="back" onclick="show('categories')">← ${t("back")}</button>

    <div class="sectionTitle">
      <h2>${catName(key)}</h2>
      <button class="voiceBtn" onclick="speakSubList('${key}')">🔊</button>
    </div>

    <div class="subGrid">
      ${items.map(([sub,emoji])=>`
        <button class="subCard" onclick="subCategoryPage('${key}','${sub}')">
          <span class="emoji">${emoji}</span>
          <strong>${subName(sub)}</strong>
        </button>
      `).join("")}
    </div>

    <div class="sectionTitle">
      <h2>${t("allProducts")}</h2>
    </div>

    <div class="products">
      ${products.filter(p=>p.cat===key).map(productCard).join("")||`

          <div class="big">🛍️</div>

        </div>

function subCategoryPage(cat,sub){
  selectedCat=cat;
  selectedSub=sub;
  subCategoryPageRender(cat,sub);
}

function subCategoryPageRender(cat,sub){
  const list=products.filter(p=>p.cat===cat&&p.sub===sub);

  getApp().innerHTML=`
    <button class="back" onclick="categoryPage('${cat}')">← ${t("back")}</button>

    <div class="sectionTitle">
      <h2>${subName(sub)}</h2>
      <button class="voiceBtn" onclick="speakText('${subName(sub)}')">🔊</button>
    </div>

    <div class="filterBar">
      <select onchange="applySubFilter('${cat}','${sub}',this.value)">
        <option value="">${t("filter")}</option>
        <option value="100-500">${t("price100500")}</option>
        <option value="500-1000">${t("price5001000")}</option>
        <option value="1000-1500">${t("price10001500")}</option>
      </select>

      <select onchange="sortSubProducts('${cat}','${sub}',this.value)">
        <option value="">${t("sort")}</option>
        <option value="low">${t("lowHigh")}</option>
        <option value="high">${t("highLow")}</option>
      </select>
    </div>

    <div id="subProducts" class="products">
      ${list.map(productCard).join("")||`
        <div class="panel empty">

        </div>

}

function productPage(id){

  const wish=getWishlist().includes(p.id);

  getApp().innerHTML=`
    <button class="back" onclick="categoryPage('${p.cat}')">← ${t("back")}</button>

    <div class="detail">
      <div class="detailImage">${p.emoji}</div>

      <div class="panel">
        <div class="sectionTitle">
          <h2>${productName(p.id)}</h2>
          <button class="heart" style="position:static" onclick="toggleWish(${p.id})">
            ${wish?"❤️":"♡"}
          </button>
        </div>

        <div class="price">${money(p.price)}</div>

        <p><strong>${t("description")}</strong></p>
        <p>${productName(p.id)} — ${t("sellerInfo")}.</p>

        <p><strong>${t("availableColors")}</strong></p>
        <div class="optionRow">
          ${(p.colors||[]).map(c=>
            `<button class="option" onclick="selectColor(this)">${colorName(c)}</button>`
          ).join("") || `<span>${t("available")}</span>`}
        </div>

        <p><strong>${t("size")}</strong></p>
        <div class="optionRow">
          ${["S","M","L","XL","XXL"].map(s=>
            `<button class="option" onclick="selectOption(this)">${s}</button>`
          ).join("")}

        <div class="panel" style="padding:13px">
          <strong>${t("delivery")}</strong>

          <button class="secondary" style="margin-top:8px" onclick="checkPin()">${t("check")}</button>

        <div class="actions">
          <button class="primary" onclick="addCart(${p.id})">${t("addCart")}</button>

function checkoutPage(){

    return;
  }

  let subtotal=0;
  cart.forEach(i=>{
    const p=products.find(x=>x.id===i.id);
    if(p)subtotal+=p.price*(i.qty||1);
  });

  getApp().innerHTML=`
    <button class="back" onclick="show('cart')">← ${t("back")}</button>

    <div class="sectionTitle">
      <h2>🧾 ${t("checkout")}</h2>
    </div>

    <div class="panel">
      <h3>${t("address")}</h3>

      <div class="formGrid">
        <div class="field">
          <label>${t("name")}</label>
          <input id="customerName">
        </div>

        <div class="field">
          <label>${t("mobile")}</label>
          <input id="customerMobile" type="tel">
        </div>

        <div class="field">
          <label>${t("email")}</label>
          <input id="customerEmail" type="email">
        </div>

        <div class="field">
          <label>${t("city")}</label>
          <input id="customerCity">
        </div>

        <div class="field">
          <label>${t("state")}</label>
          <input id="customerState">
        </div>

        <div class="field">
          <label>${t("pincode")}</label>
          <input id="customerPin">
        </div>

        <div class="field full">
          <label>${t("fullAddress")}</label>
          <textarea id="customerAddress" rows="3"></textarea>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>${t("payment")}</h3>

      <div class="payment">
        <label class="payOption active">
          <input type="radio" name="pay" value="cod" checked onchange="updatePaymentTotal()">
          <span>💵 <strong>${t("cod")}</strong> (+₹50)</span>
        </label>

        <label class="payOption">
          <input type="radio" name="pay" value="gpay" onchange="updatePaymentTotal()">
          <span>📱 <strong>${t("gpay")}</strong></span>
        </label>

        <label class="payOption">
          <input type="radio" name="pay" value="phonepe" onchange="updatePaymentTotal()">
          <span>📱 <strong>${t("phonepe")}</strong></span>
        </label>

        <label class="payOption">
          <input type="radio" name="pay" value="upi" onchange="updatePaymentTotal()">
          <span>🔵 <strong>${t("upi")}</strong></span>
        </label>

        <label class="payOption">
          <input type="radio" name="pay" value="card" onchange="updatePaymentTotal()">
          <span>💳 <strong>${t("addCard")}</strong></span>
        </label>
      </div>

      <div id="cardFields" style="display:none;margin-top:12px">
        <div class="formGrid">
          <div class="field full">
            <label>${t("cardNumber")}</label>
            <input>
          </div>
          <div class="field">
            <label>${t("expiry")}</label>
            <input>
          </div>
          <div class="field">
            <label>${t("cvv")}</label>
            <input type="password">
          </div>
        </div>
      </div>
    </div>

    <div class="totalBox">
      <div class="totalLine">
        <span>${t("subtotal")}</span>
        <strong>${money(subtotal)}</strong>
      </div>
      <div class="totalLine">
        <span>${t("codExtra")}</span>
        <strong id="checkoutCod">₹50</strong>
      </div>
      <div class="totalLine final">
        <span>${t("total")}</span>
        <span id="checkoutTotal">${money(subtotal+50)}</span>
      </div>

      <button class="primary" style="width:100%;margin-top:12px" onclick="placeOrder()">
        ${t("placeOrder")}
      </button>
    </div>
  `;

  window.__checkoutSubtotal=subtotal;
}

function searchPage(q=""){
  navigate("search",{query:q});
}

function searchPageRender(q=""){
  const term=(q||"").toLowerCase();

  const list=products.filter(p=>{
    const names=[p.name,productName(p.id),subName(p.sub),catName(p.cat)].join(" ").toLowerCase();
    return !term||names.includes(term);
  });

  getApp().innerHTML=`
    <div class="sectionTitle">
      <h2>🔎 ${t("searchResults")}</h2>
    </div>

    <div class="filterBar">
      <select onchange="searchFilter(this.value,'${encodeURIComponent(q||"")}')">
        <option value="">${t("filter")}</option>
        <option value="100-500">${t("price100500")}</option>
        <option value="500-1000">${t("price5001000")}</option>
        <option value="1000-1500">${t("price10001500")}</option>
      </select>

      <select onchange="searchSort(this.value,'${encodeURIComponent(q||"")}')">
        <option value="">${t("sort")}</option>
        <option value="low">${t("lowHigh")}</option>
        <option value="high">${t("highLow")}</option>
      </select>
    </div>

    <p>${list.length} ${t("results")}</p>

    <div id="searchProducts" class="products">
      ${list.map(productCard).join("")||`
        <div class="panel empty">
          <div class="big">🔎</div>
          <p>${t("noResults")}</p>
        </div>
      `}
    </div>
  `;
}

        ${t("exchangeRequest")}
      </button>

/* Keep page routing and rendering together */
const originalRenderPage=renderPage;
renderPage=function(){
  refreshHeader();

  if(currentPage==="subCategory"){
    subCategoryPageRender(currentArgs.cat,currentArgs.sub);
    return;
  }

  if(currentPage==="search"){
    searchPageRender(currentArgs.query);
    return;
  }

  if(currentPage==="track"){
    trackPageRender(currentArgs.id);
    return;
  }

  if(currentPage==="return"){
    returnPageRender(currentArgs.id);
    return;
  }

  if(currentPage==="exchange"){
    exchangePageRender(currentArgs.id);
    return;
  }

  if(currentPage==="product"){
    productPage(currentArgs.id);
    return;
  }

  if(currentPage==="checkout"){
    checkoutPage();
    return;
  }

  switch(currentPage){
    case"home":home();break;
    case"wishlist":wishlistPage();break;
    case"cart":cartPage();break;
    case"orders":orders();break;
    case"account":account();break;
    case"categories":categories();break;
    case"seller":seller();break;
    case"category":categoryPage(currentArgs.key);break;
    default:home();
  }
};

init();
</script>
