<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>ZipCart</title>

<style>
:root{
  --primary:#5b21b6;
  --primary2:#7c3aed;
  --pink:#ec4899;
  --pink2:#f472b6;
  --bg:#faf7ff;
  --card:#ffffff;
  --text:#222;
  --muted:#666;
  --border:#e9d5ff;
  --success:#16833a;
  --danger:#c62828;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{
  cursor:pointer;
  border:0;
}
.header{
  position:sticky;
  top:0;
  z-index:20;
  background:var(--primary);
  color:#fff;
  padding:10px;
  box-shadow:0 2px 8px #0002;
}
.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}
.logo{
  background:var(--primary);
  color:#fff;
  width:82px;
  min-width:82px;
  text-align:center;
  font-weight:bold;
  border:2px solid #fff;
  border-radius:12px;
  padding:4px;
}
.logo .z{
  display:block;
  font-size:38px;
  line-height:35px;
}
.logo .name{
  font-size:13px;
}
.search{
  flex:1;
  min-width:220px;
  display:flex;
  gap:5px;
}
.search input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:0;
}
.searchActions{
  display:flex;
  align-items:center;
  gap:5px;
  flex-wrap:wrap;
}
.navbtn{
  background:#fff;
  color:var(--primary);
  padding:10px 12px;
  border-radius:8px;
  white-space:nowrap;
  font-weight:bold;
}
.navbtn:hover{
  background:#fce7f3;
}
.count{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 6px;
  border-radius:12px;
  background:var(--pink);
  color:#fff;
  font-size:12px;
  font-weight:bold;
}
.btn{
  background:var(--primary);
  color:#fff;
  padding:10px 14px;
  border-radius:8px;
  margin:3px;
}
.btn.yellow{
  background:var(--pink);
  color:#fff;
}
.btn.light{
  background:#fff;
  color:var(--primary);
}
.btn.green{background:var(--success)}
.btn.red{background:var(--danger)}
.pill{
  background:#f3e8ff;
  color:var(--primary);
  border:1px solid #d8b4fe;
  padding:8px 12px;
  border-radius:20px;
  margin:3px;
}
.pill:hover{
  background:#fce7f3;
  border-color:var(--pink2);
}
.nav{
  max-width:1200px;
  margin:8px auto 0;
  display:flex;
  gap:5px;
  overflow:auto;
}
.nav button{
  white-space:nowrap;
  background:#fff;
  color:var(--primary);
  padding:8px 12px;
  border-radius:7px;
}
.nav button:hover{
  background:#fce7f3;
}
.page{
  max-width:1200px;
  margin:auto;
  padding:15px;
}
.panel{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 2px 8px #0000000d;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
  gap:12px;
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  box-shadow:0 2px 7px #0001;
  position:relative;
}
.productEmoji{
  height:125px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:70px;
  background:#fdf2f8;
  border-radius:10px;
}
.heart{
  position:absolute;
  top:8px;
  right:8px;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#fff;
  border:1px solid #f9a8d4;
  color:var(--pink);
  font-size:22px;
  z-index:2;
}
.heart:hover{
  background:#fce7f3;
}
.price{
  color:var(--primary);
  font-weight:bold;
  font-size:20px;
}
.old{
  text-decoration:line-through;
  color:#888;
  font-size:13px;
}
.row{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
.grow{flex:1}
.form{
  display:grid;
  gap:10px;
}
.form label{
  font-weight:bold;
}
.form input,.form select,.form textarea{
  width:100%;
  padding:11px;
  border:1px solid #d8b4fe;
  border-radius:8px;
  background:#fff;
}
textarea{min-height:90px}
.sectionTitle{
  color:var(--primary);
  margin-top:22px;
}
.notice{
  padding:12px;
  background:#fce7f3;
  border-left:5px solid var(--pink);
  border-radius:7px;
  margin:10px 0;
}
.status{
  padding:10px;
  border-radius:8px;
  background:#e9f8ed;
  color:#176d31;
  margin:10px 0;
}
.error{
  background:#ffe8e8;
  color:#a01818;
}
.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:12px;
  background:#f3e8ff;
  color:var(--primary);
  font-size:12px;
}
.qty{
  display:inline-flex;
  align-items:center;
  border:1px solid #bbb;
  border-radius:8px;
  overflow:hidden;
}
.qty button{
  width:34px;
  height:34px;
  background:#f3e8ff;
}
.qty span{
  width:40px;
  text-align:center;
}
.timeline{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin:12px 0;
}
.timeline span{
  padding:7px 9px;
  border-radius:15px;
  background:#eee;
}
.timeline span.active{
  background:var(--primary);
  color:#fff;
}
footer{
  margin-top:30px;
  padding:25px;
  background:#32105f;
  color:#fff;
}
footer button{
  background:none;
  color:#f9a8d4;
  padding:5px;
}
.modal{
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}
.modalBox{
  background:#fff;
  max-width:600px;
  width:100%;
  max-height:90vh;
  overflow:auto;
  border-radius:14px;
  padding:20px;
}
.hidden{display:none!important}
.small{font-size:13px;color:var(--muted)}
.center{text-align:center}

@media(max-width:700px){
  .top{
    align-items:stretch;
  }
  .logo{
    width:70px;
    min-width:70px;
  }
  .logo .z{
    font-size:32px;
  }
  .search{
    min-width:100%;
  }
  .searchActions{
    width:100%;
  }
  .navbtn{
    flex:1;
    text-align:center;
  }
  .grid{
    grid-template-columns:repeat(2,1fr);
  }
  .card{
    padding:8px;
  }
  .productEmoji{
    height:100px;
    font-size:55px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="top">

    <button class="logo" onclick="show('home')">
      <span class="z">Z</span>
      <span class="name">ZipCart</span>
    </button>

    <div class="search">
      <input
        id="search"
        placeholder="क्या खोजें?"
        onkeydown="if(event.key==='Enter')doSearch()"
      >

      <button class="btn yellow" onclick="doSearch()">🔎</button>
      <button class="btn light" onclick="voiceSearch()">🎙️</button>
    </div>

    <!-- Cart और Wishlist Search के ठीक पास -->
    <div class="searchActions">
      <button class="navbtn" onclick="show('wishlist')">
        ❤️ Wishlist <span class="count" id="wishCount">0</span>
      </button>

      <button class="navbtn" onclick="show('cart')">
        🛒 Cart <span class="count" id="cartCount">0</span>
      </button>
    </div>

    <button class="navbtn" onclick="show('orders')">
      📦 Orders
    </button>

    <button class="navbtn" onclick="show('account')">
      👤 Account
    </button>

    <button class="navbtn" onclick="languageModal()">
      🌐
    </button>

  </div>

  <div class="nav">
    <button onclick="show('home')">🏠 Home</button>
    <button onclick="show('categories')">📂 Categories</button>
    <button onclick="show('wishlist')">
      ❤️ Wishlist <span class="count" id="wishCountNav">0</span>
    </button>
    <button onclick="show('cart')">
      🛒 Cart <span class="count" id="cartCountNav">0</span>
    </button>
    <button onclick="show('orders')">📦 Orders</button>
    <button onclick="show('account')">👤 Account</button>
  </div>
</header>

<main class="page" id="app"></main>

<footer>
  <div class="center">
    <h3>ZipCart</h3>
    <button onclick="show('terms')">Terms & Rules</button>
    <button onclick="show('privacy')">Privacy</button>
    <button onclick="show('returnPolicy')">Return / Refund</button>
    <button onclick="show('support')">Support</button>
  </div>
</footer>

<div id="modal" class="hidden"></div>

function save(){
 localStorage.setItem("zc_cart",JSON.stringify(cart));
 localStorage.setItem("zc_wishlist",JSON.stringify(wishlist));
 localStorage.setItem("zc_orders",JSON.stringify(ordersData));
 localStorage.setItem("zc_notifications",JSON.stringify(notifications));
 localStorage.setItem("zc_reviews",JSON.stringify(reviews));
 localStorage.setItem("zc_profile",JSON.stringify(profile));
 updateCounts();
}

function updateCounts(){
 const cartTotal=cart.reduce((s,x)=>s+x.qty,0);

 const c=document.getElementById("cartCount");
 if(c)c.textContent=cartTotal;

 const cn=document.getElementById("cartCountNav");
 if(cn)cn.textContent=cartTotal;

 const w=document.getElementById("wishCount");
 if(w)w.textContent=wishlist.length;

 const wn=document.getElementById("wishCountNav");
 if(wn)wn.textContent=wishlist.length;
}

function toast(msg){
 const old=document.getElementById("toast");
 if(old)old.remove();

 const d=document.createElement("div");
 d.id="toast";
 d.textContent=msg;
 d.style.cssText=
 "position:fixed;right:15px;bottom:20px;z-index:200;background:#5b21b6;color:#fff;padding:12px 16px;border-radius:9px;box-shadow:0 3px 12px #0004";

 document.body.appendChild(d);
 setTimeout(()=>d.remove(),2200);
}

function esc(x){
 return String(x??"").replace(
  /[&<>"']/g,
  m=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   "\"":"&quot;",
   "'":"&#039;"
  }[m])
 );
}

function uid(prefix="ZC"){
 return prefix+"-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,7).toUpperCase();
}

function money(n){
 return "₹"+Number(n||0).toLocaleString("en-IN");
}

function show(page){
 if(page==="home")home();
 else if(page==="categories")categoriesPage();
 else if(page==="wishlist")wishlistPage();
 else if(page==="cart")cartPage();
 else if(page==="orders")ordersPage();
 else if(page==="account")accountPage();
 else if(page==="support")supportPage();
 else if(page==="terms")policyPage("terms");
 else if(page==="privacy")policyPage("privacy");
 else if(page==="returnPolicy")policyPage("return");
 else if(page==="notifications")notificationPage();
 else home();

 window.scrollTo(0,0);
 updateCounts();
}

function addCart(id){

 const p=products.find(x=>x.id===id);
 if(!p)return;

 let x=cart.find(a=>a.id===id);

 if(x){

  if(x.qty>=p.stock){
   toast("Maximum available stock reached");
   return;
  }

  x.qty++;

 }else{

  cart.push({
   id,
   qty:1,
   selected:true,
   color:p.colors[0],
   size:p.sizes[0]
  });

 }

 save();

 toast("🛒 Cart में जोड़ दिया गया");
}

function changeQty(id,delta){

 let x=cart.find(a=>a.id===id);
 let p=products.find(p=>p.id===id);

 if(!x||!p)return;

 x.qty+=delta;

 if(x.qty<1)x.qty=1;
 if(x.qty>p.stock)x.qty=p.stock;

 save();
 cartPage();
}

function removeCart(id){
 cart=cart.filter(x=>x.id!==id);
 save();
 cartPage();
 toast("Item removed");
}

function saveLater(id){
 removeCart(id);
 toast("💾 Saved for Later");
}

function setFast(v){

function placeOrder(){

 let name=document.getElementById("coName").value.trim();
 let mobile=document.getElementById("coMobile").value.trim();
 let pin=document.getElementById("coPin").value.trim();
 let address=document.getElementById("coAddress").value.trim();
 let ok=document.getElementById("termsCheck").checked;

 if(!name||!mobile||!pin||!address||!ok){
  toast("कृपया सभी required details और Terms स्वीकार करें");
  return;
 }

 let payment=document.querySelector(
  'input[name="pay"]:checked'
 )?.value||"COD";

 let subtotal=cart.reduce((s,x)=>{
  let p=products.find(p=>p.id===x.id);
  return s+p.price*x.qty;
 },0);

 let delivery=subtotal>=999?0:49;
 let fast=checkoutFast?25:0;

 let total=Math.max(
  0,
  subtotal+delivery+fast-appliedCoupon-giftDiscount
 );

 let order={
  id:uid("ZC"),
  date:new Date().toISOString(),

  customer:{
   name,
   mobile,
   pin,
   address
  },

  items:cart.map(x=>({...x})),

  subtotal,
  delivery,
  fast,

  discount:appliedCoupon+giftDiscount,

  total,

  payment,

  status:"Placed",
  tracking:"Order placed",
  returnStatus:"",
  exchangeStatus:"",

  giftWrap:document.getElementById("giftWrap").value,
  giftMessage:document.getElementById("giftMessage").value
 };

 ordersData.unshift(order);

 cart=[];
 appliedCoupon=0;
 giftDiscount=0;
 checkoutFast=false;

 notifications.unshift({
  id:uid("N"),
  text:"Order "+order.id+" successfully placed",
  date:new Date().toISOString(),
  read:false
 });

 save();

 orderSuccess(order);
}

 notifications.unshift({

  text:"Order "+o.id+" cancelled",

  read:false
 });

}

function doSearch(){

 let q=(document.getElementById("search").value||"").trim();

 if(q)
  searchPage(q);
}

function doSearchText(q){

 document.getElementById("search").value=q;
 searchPage(q);
}

function searchPage(q){

 let ps=products.filter(p=>
  (p.name+" "+p.sub+" "+p.cat)
  .toLowerCase()
  .includes(q.toLowerCase())
 );

 let activePrice="all";
 let activeRating=0;
 let activeSort="default";

 function renderResults(){

  let result=[...ps];

  if(activePrice!=="all"){

   result=result.filter(p=>{

    if(activePrice==="0-500")
     return p.price<=500;

    if(activePrice==="500-1000")
     return p.price>500&&p.price<=1000;

    if(activePrice==="1000-1500")
     return p.price>1000&&p.price<=1500;

    if(activePrice==="1500-2000")
     return p.price>1500&&p.price<=2000;

    if(activePrice==="2000-3000")
     return p.price>2000&&p.price<=3000;

    if(activePrice==="3000-5000")
     return p.price>3000&&p.price<=5000;

    if(activePrice==="5000-10000")
     return p.price>5000&&p.price<=10000;

    if(activePrice==="10000+")
     return p.price>10000;

    return true;
   });
  }

  if(activeRating>0)
   result=result.filter(p=>p.rating>=activeRating);

  if(activeSort==="low")
   result.sort((a,b)=>a.price-b.price);

  if(activeSort==="high")
   result.sort((a,b)=>b.price-a.price);

  if(activeSort==="rating")
   result.sort((a,b)=>b.rating-a.rating);

  const box=document.getElementById("searchResults");
  const count=document.getElementById("resultCount");

  if(count)
   count.textContent=result.length+" विकल्प मिले";

  if(box)
   box.innerHTML=result.map(productCard).join("")
   ||`<div class="panel">कोई product नहीं मिला।</div>`;
 }

 app.innerHTML=`

 <button class="pill"
   onclick="show('home')">
   ← Home
 </button>

 <div class="panel">

  <h2>
   🔎 Search: “${esc(q)}”
  </h2>

  <p id="resultCount">
   ${ps.length} विकल्प मिले
  </p>

  <h3>💰 Price</h3>

  <div>

   <button class="pill"
     onclick="priceFilter('all')">
     All
   </button>

   <button class="pill"
     onclick="priceFilter('0-500')">
     ₹100–₹500
   </button>

   <button class="pill"
     onclick="priceFilter('500-1000')">
     ₹500–₹1,000
   </button>

   <button class="pill"
     onclick="priceFilter('1000-1500')">
     ₹1,000–₹1,500
   </button>

   <button class="pill"
     onclick="priceFilter('1500-2000')">
     ₹1,500–₹2,000
   </button>

   <button class="pill"
     onclick="priceFilter('2000-3000')">
     ₹2,000–₹3,000
   </button>

   <button class="pill"
     onclick="priceFilter('3000-5000')">
     ₹3,000–₹5,000
   </button>

   <button class="pill"
     onclick="priceFilter('5000-10000')">
     ₹5,000–₹10,000
   </button>

   <button class="pill"
     onclick="priceFilter('10000+')">
     ₹10,000+
   </button>

  </div>

  <h3>⭐ Rating</h3>

  <button class="pill"
    onclick="ratingFilter(0)">
    All
  </button>

  <button class="pill"
    onclick="ratingFilter(4)">
    ⭐ 4+
  </button>

  <button class="pill"
    onclick="ratingFilter(4.5)">
    ⭐ 4.5+
  </button>

  <h3>↕️ Sort</h3>

  <button class="pill"
    onclick="sortProducts('low')">
    Price Low-High
  </button>

  <button class="pill"
    onclick="sortProducts('high')">
    Price High-Low
  </button>

  <button class="pill"
    onclick="sortProducts('rating')">
    Highest Rating
  </button>

  <button class="pill"
    onclick="sortProducts('default')">
    Popular
  </button>

 </div>

 <div id="searchResults"
   class="grid">
 </div>`;

 window.priceFilter=v=>{
  activePrice=v;
  renderResults();
 };

 window.ratingFilter=v=>{
  activeRating=v;
  renderResults();
 };

 window.sortProducts=v=>{
  activeSort=v;
  renderResults();
 };

 renderResults();
}

function voiceSearch(){

 if(!("webkitSpeechRecognition" in window||
      "SpeechRecognition" in window)){

  toast("इस browser में voice search उपलब्ध नहीं है");
  return;
 }

 const R=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

 const r=new R();

 const langMap={
  hi:"hi-IN",
  en:"en-US",
  gu:"gu-IN",
  mr:"mr-IN",
  bn:"bn-IN",
  ta:"ta-IN",
  te:"te-IN",
  kn:"kn-IN",
  ml:"ml-IN",
  pa:"pa-IN"
 };

 r.lang=langMap[selectedLang]||"hi-IN";

 r.onresult=e=>{

  let q=e.results[0][0].transcript;

  document.getElementById("search").value=q;

  searchPage(q);
 };

 r.onerror=()=>{
  toast("Voice search पूरा नहीं हो सका");
 };

 r.start();
}

function speak(text){

 if(!("speechSynthesis" in window)){
  toast("Voice सुविधा उपलब्ध नहीं है");
  return;
 }

 const u=new SpeechSynthesisUtterance(text);

 const lm={
  hi:"hi-IN",
  en:"en-US",
  gu:"gu-IN",
  mr:"mr-IN",
  bn:"bn-IN",
  ta:"ta-IN",
  te:"te-IN",
  kn:"kn-IN",
  ml:"ml-IN",
  pa:"pa-IN",
  ur:"ur-IN"
 };

 u.lang=lm[selectedLang]||"hi-IN";

 speechSynthesis.cancel();
 speechSynthesis.speak(u);
}

function exportData(){

 const data={
  profile,
  cart,
  wishlist,
  ordersData,
  notifications,
  reviews,
  exportedAt:new Date().toISOString()
 };

 const blob=new Blob(
  [JSON.stringify(data,null,2)],
  {type:"application/json"}
 );

 const a=document.createElement("a");

 a.href=URL.createObjectURL(blob);
 a.download="zipcart-demo-backup.json";

 a.click();

 URL.revokeObjectURL(a.href);

 toast("Backup exported");
}
